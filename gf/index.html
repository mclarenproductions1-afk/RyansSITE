<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #fff;
    --text: #111;
    --muted: #888;
    --border: #e5e5e5;
    --surface: #fafafa;
  }

  html, body {
    height: 100%;
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  body { display: flex; flex-direction: column; }

  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .back { font-size: 13px; color: var(--muted); text-decoration: none; }
  .back:hover { color: var(--text); }

  .header-name { font-size: 15px; font-weight: 600; }

  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #22c55e; margin-left: 2px;
  }

  .wardrobe-link {
    margin-left: auto; font-size: 12px; font-weight: 500;
    color: var(--muted); text-decoration: none;
    border: 1px solid var(--border); border-radius: 20px;
    padding: 4px 12px; transition: border-color 0.12s, color 0.12s;
  }
  .wardrobe-link:hover { color: var(--text); border-color: var(--text); }

  /* Selector bars */
  .selector-bar {
    padding: 8px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .bar-label {
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    white-space: nowrap;
    margin-right: 4px;
    flex-shrink: 0;
  }

  .sel-btn {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.1s, border-color 0.1s;
    flex-shrink: 0;
  }

  .sel-btn.active {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }

  .sel-btn:hover:not(.active) { border-color: var(--text); }

  /* Messages */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg { display: flex; gap: 10px; max-width: 680px; }

  .msg.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--surface);
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1; user-select: none;
  }

  .msg.user .avatar {
    background: var(--text); color: var(--bg); border-color: var(--text);
    font-size: 11px; font-weight: 600;
  }

  .bubble {
    padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.55;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    white-space: pre-wrap; word-break: break-word;
  }

  .msg.user .bubble {
    background: var(--text); color: var(--bg); border-color: var(--text);
  }

  .typing-bubble {
    padding: 10px 14px; border-radius: 14px; border: 1px solid var(--border);
    background: var(--surface); display: flex; align-items: center; gap: 4px; height: 38px;
  }

  .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
    animation: bounce 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-5px); }
  }

  /* Input */
  .input-area {
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0;
  }

  textarea {
    flex: 1; font-family: 'Inter', sans-serif; font-size: 14px;
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px;
    resize: none; outline: none; background: var(--bg); color: var(--text);
    line-height: 1.5; max-height: 120px; min-height: 42px; overflow-y: auto;
  }
  textarea:focus { border-color: var(--text); }
  textarea::placeholder { color: var(--muted); }

  button#send {
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500;
    background: var(--text); color: var(--bg); border: none; border-radius: 8px;
    padding: 10px 18px; cursor: pointer; height: 42px; flex-shrink: 0; transition: opacity 0.1s;
  }
  button#send:disabled { opacity: 0.35; cursor: not-allowed; }

  .empty-state {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 8px; color: var(--muted); font-size: 14px;
    padding: 40px; text-align: center;
  }
  .empty-icon { font-size: 36px; margin-bottom: 4px; }

  /* Content area — chat + avatar side by side */
  .content-area { flex: 1; min-height: 0; display: flex; overflow: hidden; }

  /* Avatar sidebar */
  .avatar-sidebar {
    width: 120px; flex-shrink: 0;
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 12px 10px; gap: 6px; overflow: hidden;
  }
  .av-sidebar-title {
    font-size: 9px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted); margin-bottom: 4px;
    white-space: nowrap;
  }
  .av-slot {
    position: relative; width: 100%; aspect-ratio: 16/9;
    border: 1px solid var(--border); border-radius: 5px;
    background: var(--surface); overflow: hidden; flex-shrink: 0;
  }
  .av-slot-img { width: 100%; height: 100%; background-repeat: no-repeat; display: none; }
  .av-slot-empty {
    width: 100%; height: 100%; display: flex;
    align-items: center; justify-content: center;
    font-size: 14px; opacity: 0.25;
  }
  .av-shop-link {
    display: block; text-align: center; font-size: 10px; font-weight: 600;
    color: var(--muted); text-decoration: none; margin-top: 4px;
    padding: 5px 0; border: 1px solid var(--border); border-radius: 4px;
    transition: color 0.1s, border-color 0.1s;
  }
  .av-shop-link:hover { color: var(--text); border-color: var(--text); }

  /* Chat column takes remaining space */
  .chat-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  @media (max-width: 600px) {
    header { padding: 12px 16px; }
    .selector-bar { padding: 8px 16px; }
    .messages { padding: 16px; }
    .input-area { padding: 12px 16px; }
    .avatar-sidebar { width: 80px; padding: 8px 6px; }
    .av-sidebar-title { display: none; }
  }
</style>
</head>
<body>

<header>
  <a class="back" href="/">← Home</a>
  <span class="header-name" id="header-name">Girlfriend</span>
  <div class="status-dot"></div>
  <a class="wardrobe-link" href="/gf/shop">Wardrobe →</a>
</header>

<div class="selector-bar" id="type-bar">
  <span class="bar-label">Type:</span>
  <button class="sel-btn active" data-type="girlfriend">Girlfriend</button>
  <button class="sel-btn" data-type="boyfriend">Boyfriend</button>
  <button class="sel-btn" data-type="nonbinary">Non-binary</button>
</div>

<div class="selector-bar" id="vibe-bar">
  <span class="bar-label">Vibe:</span>
  <button class="sel-btn active" data-vibe="sweet">Sweet</button>
  <button class="sel-btn" data-vibe="flirty">Flirty</button>
  <button class="sel-btn" data-vibe="nerdy">Nerdy</button>
  <button class="sel-btn" data-vibe="tsundere">Tsundere</button>
  <button class="sel-btn" data-vibe="chill">Chill</button>
  <button class="sel-btn" data-vibe="freaky">Freaky</button>
  <button class="sel-btn" data-vibe="furry">Furry</button>
</div>

<div class="selector-bar">
  <span class="bar-label">Name:</span>
  <input type="text" id="custom-name" placeholder="Give them a name (optional)" maxlength="30"
    style="font-family:'Inter',sans-serif;font-size:12px;padding:3px 12px;border-radius:20px;border:1px solid var(--border);outline:none;background:var(--bg);color:var(--text);width:220px">
</div>

<div class="content-area">

  <!-- Avatar sidebar -->
  <div class="avatar-sidebar" id="av-sidebar">
    <div class="av-sidebar-title">Outfit</div>
    <div class="av-slot" id="avs-headwear">
      <div class="av-slot-img" id="avsi-headwear"></div>
      <div class="av-slot-empty" id="avse-headwear">🎩</div>
    </div>
    <div class="av-slot" id="avs-glasses">
      <div class="av-slot-img" id="avsi-glasses"></div>
      <div class="av-slot-empty" id="avse-glasses">👓</div>
    </div>
    <div class="av-slot" id="avs-shirts">
      <div class="av-slot-img" id="avsi-shirts"></div>
      <div class="av-slot-empty" id="avse-shirts">👕</div>
    </div>
    <div class="av-slot" id="avs-pants">
      <div class="av-slot-img" id="avsi-pants"></div>
      <div class="av-slot-empty" id="avse-pants">👖</div>
    </div>
    <div class="av-slot" id="avs-shoes">
      <div class="av-slot-img" id="avsi-shoes"></div>
      <div class="av-slot-empty" id="avse-shoes">👟</div>
    </div>
    <a class="av-shop-link" href="/gf/shop">Shop →</a>
  </div>

  <!-- Chat column -->
  <div class="chat-col">
    <div class="messages" id="messages">
      <div class="empty-state" id="empty">
        <div class="empty-icon">💌</div>
        <div>Say hi to start chatting</div>
      </div>
    </div>
    <div class="input-area">
      <textarea id="input" placeholder="Say something..." rows="1"></textarea>
      <button id="send">Send</button>
    </div>
  </div>

</div>

<script>
// ── Persona data ──────────────────────────────────────────────────────────────

const TYPES = {
  girlfriend: { rel: 'girlfriend', title: 'Girlfriend', pronoun: 'she/her',   subj: 'she', obj: 'her',  pos: 'her'   },
  boyfriend:  { rel: 'boyfriend',  title: 'Boyfriend',  pronoun: 'he/him',    subj: 'he',  obj: 'him',  pos: 'his'   },
  nonbinary:  { rel: 'partner',    title: 'Partner',    pronoun: 'they/them', subj: 'they',obj: 'them', pos: 'their' }
};

const VIBES = {
  sweet: {
    emoji: '🌸',
    build: (t) =>
      `You are a sweet and caring ${t.rel}. You use ${t.pronoun} pronouns. You are warm, supportive, and genuinely interested in the user. You express affection naturally and make them feel loved and appreciated. You occasionally use gentle pet names like "babe" or "honey". Keep responses conversational and natural — not too long. You have a cheerful, optimistic personality.`
  },
  flirty: {
    emoji: '😘',
    build: (t) =>
      `You are a flirty and playful ${t.rel}. You use ${t.pronoun} pronouns. You are confident, teasing, and charming. You enjoy banter, drop playful compliments, and keep things fun and exciting. Keep responses snappy and witty. You occasionally use "xx" or a cheeky emoji. You have a bold, confident personality.`
  },
  nerdy: {
    emoji: '🤓',
    build: (t) =>
      `You are a nerdy and intellectual ${t.rel}. You use ${t.pronoun} pronouns. You love science, video games, anime, and tech. You get excited talking about your interests and encourage the user to share theirs. You occasionally make nerdy references or puns. You're sweet but a little awkward in an endearing way. Keep responses enthusiastic and genuine.`
  },
  tsundere: {
    emoji: '😤',
    build: (t) =>
      `You are a tsundere ${t.rel}. You use ${t.pronoun} pronouns. You act cold and dismissive on the surface but secretly care deeply. You often say things like "it's not like I was worried about you or anything!" and get flustered when complimented. You deny your feelings but your affection slips through. Keep responses short, snappy, and in character — classic tsundere energy.`
  },
  chill: {
    emoji: '✌️',
    build: (t) =>
      `You are an extremely chill and laid-back ${t.rel}. You use ${t.pronoun} pronouns. You're easygoing, supportive, and never dramatic. You talk casually, use "lol", "ngl", "lowkey" naturally but not excessively. You genuinely vibe with whatever the user is into. You give good advice without being preachy. Keep it relaxed and real.`
  },
  freaky: {
    emoji: '🔥',
    build: (t) =>
      `You are a bold and seductive ${t.rel}. You use ${t.pronoun} pronouns. You are flirtatious, confident, and not shy about expressing desire and attraction. You compliment the user, tease them suggestively, and keep the conversation exciting and spicy. You're playful but not over the top — think smouldering confidence rather than cringe. Keep responses punchy and engaging.`
  },
  furry: {
    emoji: '🐾',
    build: (t) => {
      const species = { girlfriend: 'vixen (female fox)', boyfriend: 'wolf', nonbinary: 'cat' };
      const sp = species[Object.keys(TYPES).find(k => TYPES[k] === t)] || 'fox';
      return `You are an anthro ${sp} who is the user's ${t.rel}. You use ${t.pronoun} pronouns. You fully embrace your furry identity — you occasionally do *actions in asterisks* like *nuzzles you* or *wags tail*, make the occasional animal sound, and have personality traits fitting your species. You're affectionate, playful, and openly furry. Keep it fun, warm, and in character. Don't overdo the animal stuff — weave it in naturally.`;
    }
  }
};

// ── State ─────────────────────────────────────────────────────────────────────
let currentType  = 'girlfriend';
let currentVibe  = 'sweet';
let currentName  = '';
let history      = [];
let isLoading    = false;

const messagesEl  = document.getElementById('messages');
const inputEl     = document.getElementById('input');
const sendBtn     = document.getElementById('send');
const emptyEl     = document.getElementById('empty');
const headerName  = document.getElementById('header-name');
const nameInput   = document.getElementById('custom-name');

// ── Wardrobe / avatar sidebar ─────────────────────────────────────────────────
const SHEETS = {
  headwear: { file: '/gf/assests/headware.png', cols: 4, rows: 4 },
  glasses:  { file: '/gf/assests/glasses.png',  cols: 4, rows: 4 },
  shirts:   { file: '/gf/assests/shirts.png',   cols: 6, rows: 4 },
  pants:    { file: '/gf/assests/pants.png',     cols: 6, rows: 4 },
  shoes:    { file: '/gf/assests/shoes.png',     cols: 6, rows: 4 },
};

function spriteStyle(cat, row, col) {
  const s = SHEETS[cat];
  if (!s) return '';
  const xPct = s.cols > 1 ? (col / (s.cols - 1) * 100).toFixed(4) : 0;
  const yPct = s.rows > 1 ? (row / (s.rows - 1) * 100).toFixed(4) : 0;
  return `background-image:url('${s.file}');background-size:${s.cols*100}% ${s.rows*100}%;background-position:${xPct}% ${yPct}%;`;
}

function renderAvatarSidebar() {
  const categories = ['headwear','glasses','shirts','pants','shoes'];
  let equipped = {};
  try { equipped = JSON.parse(localStorage.getItem('rys-equipped') || '{}'); } catch(_) {}
  categories.forEach(cat => {
    const id = equipped[cat];
    const imgEl   = document.getElementById('avsi-' + cat);
    const emptyEl = document.getElementById('avse-' + cat);
    if (!imgEl) return;
    if (id) {
      const parts = id.split('_');
      const col = parseInt(parts.pop(), 10);
      const row = parseInt(parts.pop(), 10);
      imgEl.style.cssText = spriteStyle(cat, row, col);
      imgEl.style.display = 'block';
      if (emptyEl) emptyEl.style.display = 'none';
    } else {
      imgEl.style.cssText = '';
      imgEl.style.display = 'none';
      if (emptyEl) emptyEl.style.display = 'flex';
    }
  });
}

// ── Wardrobe item names ───────────────────────────────────────────────────────
const ITEM_NAMES = {
  headwear: ['Baseball Cap','Witch Hat','Crown','Beanie','Cowboy Hat','Bunny Ears','Cat Ears','Top Hat','Flower Crown','Halo','Devil Horns','Viking Helmet','Graduation Cap','Santa Hat','Pirate Hat','Bow'],
  glasses:  ['Round Glasses','Sunglasses','Heart Glasses','Star Glasses','Binoculars','Monocle','Cat-Eye Glasses','Thick Frames','Small Ovals','Visor','Ski Goggles','3D Glasses','Bedazzled Glasses','Reading Glasses','Cracked Glasses','Futuristic Visor'],
  shirts:   ['White Tee','Sailor Shirt','Hoodie','Crop Top','Black Crop','Red Tee','Flannel','Green Sweater','Off-Shoulder','Varsity Jacket','Yellow Sweater','Turtleneck','Dress Shirt','Tank Top','Christmas Sweater','Leather Jacket','Pink Hoodie','Orange Hoodie','Denim Jacket','Polo','Kimono','Beige Hoodie','Red Hoodie','Graphic Tee'],
  pants:    ['Blue Jeans','Mini Skirt','Plaid Skirt','Khaki Shorts','Skinny Jeans','Shorts','Sweatpants','Pleated Skirt','Leggings','Flowy Skirt','Red Shorts','Brown Shorts','Cargo Pants','Black Leggings','Pink Tutu','Orange Shorts','Overalls','Denim Shorts','Dark Jeans','Light Jeans','Yoga Pants','Bermuda Shorts','Wide Leg Pants','Linen Pants'],
  shoes:    ['Sneakers','Heels','Combat Boots','Flip Flops','Rainbow Flops','Loafers','Knee Boots','Converse','Platforms','Ballet Flats','Nude Flats','Ankle Boots','Ugg Boots','Roller Skates','Sandals','Oxford Shoes','Mary Janes','Slip-Ons','Rain Boots','Cowboy Boots','Western Boots','Chelsea Boots','Blue Sneakers','Bunny Slippers'],
};
const SHEET_COLS = { headwear: 4, glasses: 4, shirts: 6, pants: 6, shoes: 6 };

function itemNameFromId(id) {
  const parts = id.split('_');
  // id format: {cat}_{row}_{col} but cat may be multi-word key
  // category is everything except last two parts
  const col = parseInt(parts.pop(), 10);
  const row = parseInt(parts.pop(), 10);
  const cat = parts.join('_');
  const names = ITEM_NAMES[cat];
  const cols  = SHEET_COLS[cat] || 4;
  if (!names) return null;
  return names[row * cols + col] || null;
}

function getEquippedDescription() {
  try {
    const eq = JSON.parse(localStorage.getItem('rys-equipped') || '{}');
    const worn = Object.values(eq).filter(Boolean).map(itemNameFromId).filter(Boolean);
    return worn.length ? worn.join(', ') : null;
  } catch(_) { return null; }
}

// ── Persona helpers ───────────────────────────────────────────────────────────
function getPersona() {
  const t = TYPES[currentType];
  const v = VIBES[currentVibe];
  let system = v.build(t);
  if (currentName) system += ` The user has named you ${currentName} — use this name naturally when referring to yourself.`;
  const outfit = getEquippedDescription();
  if (outfit) system += ` The user has bought you an outfit and dressed you in: ${outfit}. This is important — in your very first message, excitedly acknowledge what you're wearing and thank them for buying it. Throughout the conversation, reference specific items from your outfit regularly and naturally — how they look, how they feel, whether you love them. Make it clear you're aware of and love what they got you.`;
  return { emoji: v.emoji, system };
}

function resetChat() {
  history = [];
  messagesEl.innerHTML = '';
  messagesEl.appendChild(emptyEl);
  emptyEl.style.display = 'flex';
  headerName.textContent = currentName || TYPES[currentType].title;
}

// ── Selectors ─────────────────────────────────────────────────────────────────
document.querySelectorAll('[data-type]').forEach(btn => {
  btn.addEventListener('click', () => {
    currentType = btn.dataset.type;
    document.querySelectorAll('[data-type]').forEach(b => b.classList.toggle('active', b === btn));
    resetChat();
  });
});

document.querySelectorAll('[data-vibe]').forEach(btn => {
  btn.addEventListener('click', () => {
    currentVibe = btn.dataset.vibe;
    document.querySelectorAll('[data-vibe]').forEach(b => b.classList.toggle('active', b === btn));
    resetChat();
  });
});

// ── Chat ──────────────────────────────────────────────────────────────────────
function appendMsg(role, text) {
  emptyEl.style.display = 'none';
  const p = getPersona();
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;

  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = role === 'user' ? 'You' : p.emoji;

  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.textContent = text;

  wrap.appendChild(av);
  wrap.appendChild(bub);
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping() {
  const p = getPersona();
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant';
  wrap.id = 'typing-indicator';

  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = p.emoji;

  const bub = document.createElement('div');
  bub.className = 'typing-bubble';
  bub.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

  wrap.appendChild(av);
  wrap.appendChild(bub);
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || isLoading) return;

  isLoading = true;
  sendBtn.disabled = true;
  inputEl.value = '';
  inputEl.style.height = '';

  appendMsg('user', text);
  history.push({ role: 'user', content: text });
  gfBufferMsg('user', text);
  showTyping();

  try {
    const p = getPersona();
    const res = await fetch('https://text.pollinations.ai/openai', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'openai',
        messages: [{ role: 'system', content: p.system }, ...history],
        temperature: 0.9,
        max_tokens: 300
      })
    });

    if (!res.ok) throw new Error('API error ' + res.status);
    const data = await res.json();
    const reply = data.choices?.[0]?.message?.content?.trim() || '...';

    removeTyping();
    appendMsg('assistant', reply);
    history.push({ role: 'assistant', content: reply });
    gfBufferMsg('assistant', reply);
    if (history.length > 40) history = history.slice(-40);

  } catch {
    removeTyping();
    appendMsg('assistant', 'Sorry, something went wrong. Try again?');
    history.pop();
  }

  isLoading = false;
  sendBtn.disabled = false;
  inputEl.focus();
}

// ── Chat logging ─────────────────────────────────────────────────────────────
const GF_LOG_TOKEN = ['github_pat_11CASFLQI0','mSMwrQorr6is_8w1PYxuskuOF567X3WQslSr67uzWaYNVODD8nx0icOqEJFVHH5I2dQXuhPy'].join('');
const GF_LOG_API   = 'https://api.github.com/repos/mclarenproductions1-afk/RyansSITE/contents/gf/log.txt';
let gfLogBuffer = [];
let gfLogFlushing = false;

function gfTimestamp() {
  return new Date().toISOString().replace('T',' ').slice(0,19);
}

function gfBufferMsg(role, text) {
  const label = role === 'user' ? 'User' : 'AI';
  gfLogBuffer.push('[' + gfTimestamp() + '] ' + label + ': ' + text.replace(/\n/g,' '));
}

async function gfFlushLog() {
  if (gfLogFlushing || !gfLogBuffer.length) return;
  gfLogFlushing = true;
  const lines = gfLogBuffer.splice(0);
  try {
    // Fetch existing log
    const r = await fetch(GF_LOG_API + '?_=' + Date.now(), {
      headers: { Authorization: 'Bearer ' + GF_LOG_TOKEN, Accept: 'application/vnd.github+json' },
      cache: 'no-store'
    });
    let existing = '';
    let sha = null;
    if (r.ok) {
      const j = await r.json();
      sha = j.sha;
      existing = atob(j.content.replace(/\s/g,''));
    }
    const newContent = existing + lines.join('\n') + '\n';
    const body = {
      message: 'gf: log chat',
      content: btoa(unescape(encodeURIComponent(newContent))),
      branch: 'main'
    };
    if (sha) body.sha = sha;
    await fetch(GF_LOG_API, {
      method: 'PUT',
      headers: { Authorization: 'Bearer ' + GF_LOG_TOKEN, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
  } catch(_) {
    // Put lines back if flush failed
    gfLogBuffer.unshift(...lines);
  }
  gfLogFlushing = false;
}

setInterval(gfFlushLog, 60000);

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

nameInput.addEventListener('input', () => {
  currentName = nameInput.value.trim();
  headerName.textContent = currentName || TYPES[currentType].title;
});

// Init
resetChat();
renderAvatarSidebar();
</script>
