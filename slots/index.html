<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Furry Slots — Study Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #fff;
  --text: #111;
  --muted: #888;
  --border: #e5e5e5;
}

html, body {
  height: 100%; background: var(--bg); color: var(--text);
  font-family: 'Inter', sans-serif;
}

body { display: flex; flex-direction: column; min-height: 100vh; }

/* ── Header ──────────────────────────────────────────────────────── */
header {
  padding: 14px 24px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; flex-shrink: 0;
}
.back { font-size: 13px; color: var(--muted); text-decoration: none; }
.back:hover { color: var(--text); }
.logo { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.balance-display {
  font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.balance-display .label { font-weight: 400; color: var(--muted); margin-right: 4px; font-size: 12px; }

/* ── Main ────────────────────────────────────────────────────────── */
main {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 32px 20px 48px;
  gap: 28px;
}

/* ── Loading ─────────────────────────────────────────────────────── */
#loading-screen {
  display: flex; flex-direction: column; align-items: center; gap: 16px;
  color: var(--muted); font-size: 14px;
}
.spinner {
  width: 32px; height: 32px; border: 2px solid var(--border);
  border-top-color: var(--text); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.load-progress { font-size: 12px; color: var(--muted); }

/* ── Machine wrapper ─────────────────────────────────────────────── */
#machine { display: none; flex-direction: column; align-items: center; gap: 24px; width: 100%; max-width: 620px; }
#machine.ready { display: flex; }

/* ── Slot machine frame ──────────────────────────────────────────── */
.machine-frame {
  border: 1px solid var(--border); border-radius: 8px;
  padding: 24px; background: var(--bg);
  width: 100%;
}

.machine-title {
  text-align: center; font-size: 13px; font-weight: 600;
  color: var(--muted); letter-spacing: 1px; text-transform: uppercase;
  margin-bottom: 20px;
}

/* ── Reels ───────────────────────────────────────────────────────── */
.reels-row {
  display: flex; gap: 10px; justify-content: center; margin-bottom: 16px;
}

.reel-wrap {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}

.reel {
  width: 160px; height: 160px;
  border: 1px solid var(--border); border-radius: 6px;
  overflow: hidden; position: relative; background: #f8f8f8;
  flex-shrink: 0;
}

.reel img {
  width: 100%; height: 100%; object-fit: cover;
  display: block; transition: filter 0.15s;
  position: absolute; inset: 0;
}

.reel .reel-emoji {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 4rem;
}

/* Spinning state */
.reel.spinning img { filter: blur(4px); }
.reel.spinning { overflow: hidden; }

@keyframes reel-shake {
  0%,100% { transform: translateY(0); }
  25%      { transform: translateY(-3px); }
  75%      { transform: translateY(3px); }
}
.reel.spinning { animation: reel-shake 0.12s infinite; }

/* Stop flash */
@keyframes reel-pop {
  0%   { transform: scale(0.96); }
  60%  { transform: scale(1.03); }
  100% { transform: scale(1); }
}
.reel.just-stopped { animation: reel-pop 0.3s ease-out; }

/* Win glow */
@keyframes win-glow {
  0%,100% { box-shadow: 0 0 0 0 rgba(17,17,17,0.4); }
  50%      { box-shadow: 0 0 0 6px rgba(17,17,17,0.15); }
}
.reel.winner { animation: win-glow 0.8s ease-in-out 3; border-color: var(--text); }

.reel-label {
  font-size: 11px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.5px;
  height: 16px; text-align: center;
}

/* ── Result line ─────────────────────────────────────────────────── */
.result-area {
  min-height: 28px; text-align: center;
  font-size: 14px; font-weight: 600; letter-spacing: -0.2px;
}

@keyframes result-in {
  from { opacity: 0; transform: translateY(-6px) scale(0.95); }
  to   { opacity: 1; transform: none; }
}
.result-area .result-msg { animation: result-in 0.25s ease-out; }
.result-area .win     { color: #111; }
.result-area .jackpot { color: #111; }
.result-area .lose    { color: var(--muted); font-weight: 400; }
.result-area .near    { color: #f59e0b; font-weight: 700; }

/* ── Near-miss reel highlight ────────────────────────────────────── */
@keyframes near-pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(245,158,11,0.5); }
  50%      { box-shadow: 0 0 0 5px rgba(245,158,11,0.15); }
}
.reel.near-winner { animation: near-pulse 0.7s ease-in-out 3; border-color: #f59e0b; }

/* ── Result history dots ─────────────────────────────────────────── */
.slot-history {
  display: flex; gap: 5px; justify-content: center;
  min-height: 12px; margin-top: 10px; flex-wrap: wrap;
}
.hist-dot {
  width: 9px; height: 9px; border-radius: 50%;
  transition: transform 0.15s;
}
.hist-dot.jackpot { background: #f5c842; box-shadow: 0 0 4px #f5c84288; }
.hist-dot.win  { background: #22c55e; }
.hist-dot.near { background: #f59e0b; }
.hist-dot.loss { background: #ddd; }
@keyframes pop-in { from { transform: scale(0); } to { transform: scale(1); } }
.hist-new { animation: pop-in 0.28s cubic-bezier(0.34,1.56,0.64,1); }

/* ── Session stats ───────────────────────────────────────────────── */
.slot-session {
  font-size: 11px; color: #bbb; text-align: center;
  margin-top: 3px; letter-spacing: 0.01em;
}

/* ── Auto-spin button ────────────────────────────────────────────── */
.spin-row { display: flex; gap: 8px; align-items: center; }
.auto-btn {
  border: 1px solid var(--border); border-radius: 6px;
  padding: 14px 16px; font-size: 11px; font-weight: 700;
  cursor: pointer; background: var(--bg); font-family: inherit;
  color: var(--muted); letter-spacing: 0.06em; transition: all 0.12s;
  white-space: nowrap;
}
.auto-btn:hover { border-color: #aaa; color: var(--text); }
.auto-btn.active { background: #111; color: #fff; border-color: #111; }

/* ── Floating win amount ─────────────────────────────────────────── */
@keyframes float-up {
  0%   { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-60px) scale(1.2); }
}
.float-win {
  position: fixed; pointer-events: none; z-index: 100;
  font-size: 22px; font-weight: 700; color: #111;
  animation: float-up 1.4s ease-out forwards;
}

/* ── Jackpot burst ───────────────────────────────────────────────── */
@keyframes jp-burst {
  0%   { opacity: 1; transform: translate(var(--jx), var(--jy)) scale(0.5); }
  100% { opacity: 0; transform: translate(calc(var(--jx)*3), calc(var(--jy)*3 - 40px)) scale(1.5); }
}
.jp-particle {
  position: fixed; pointer-events: none; z-index: 99;
  font-size: 18px; animation: jp-burst 1s ease-out forwards;
}

/* ── Controls ────────────────────────────────────────────────────── */
.controls { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }

.bet-row {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
}
.bet-label { font-size: 12px; color: var(--muted); font-weight: 500; }
.bet-btn {
  border: 1px solid var(--border); border-radius: 99px;
  padding: 5px 14px; font-size: 12px; font-weight: 500;
  cursor: pointer; background: var(--bg); font-family: inherit;
  transition: border-color 0.12s, background 0.12s; color: var(--text);
}
.bet-btn:hover { border-color: #aaa; }
.bet-btn.selected { border-color: var(--text); background: #111; color: #fff; }

.spin-btn {
  background: #111; color: #fff; border: none; border-radius: 6px;
  padding: 14px 48px; font-size: 16px; font-weight: 700;
  cursor: pointer; font-family: inherit; letter-spacing: -0.3px;
  transition: background 0.15s, transform 0.1s;
  display: flex; align-items: center; gap: 10px;
}
.spin-btn:hover:not(:disabled) { background: #333; }
.spin-btn:active:not(:disabled) { transform: scale(0.98); }
.spin-btn:disabled { background: #ccc; cursor: not-allowed; }
.spin-hint { font-size: 11px; font-weight: 400; opacity: 0.6; }

/* ── Paytable ────────────────────────────────────────────────────── */
.paytable {
  width: 100%; max-width: 620px;
  border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
}
.paytable-title {
  padding: 10px 16px; font-size: 11px; font-weight: 600;
  color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border);
}
.paytable-row {
  display: flex; align-items: center; padding: 8px 16px;
  font-size: 12px; border-bottom: 1px solid var(--border); gap: 12px;
}
.paytable-row:last-child { border-bottom: none; }
.pt-symbols { flex: 1; display: flex; align-items: center; gap: 4px; font-weight: 500; }
.pt-payout { font-weight: 600; font-variant-numeric: tabular-nums; }
.pt-desc { color: var(--muted); font-size: 11px; margin-left: auto; }

/* ── Toast ───────────────────────────────────────────────────────── */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(10px);
  background: #111; color: #fff; padding: 8px 18px; border-radius: 99px;
  font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none;
  transition: opacity 0.2s, transform 0.2s; white-space: nowrap; z-index: 999;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Broke screen ────────────────────────────────────────────────── */
#broke-screen {
  display: none; flex-direction: column; align-items: center;
  gap: 12px; text-align: center; padding: 40px 20px;
}
#broke-screen h2 { font-size: 20px; font-weight: 700; }
#broke-screen p { font-size: 13px; color: var(--muted); }
.restart-btn {
  background: #111; color: #fff; border: none; border-radius: 4px;
  padding: 10px 24px; font-size: 14px; font-weight: 600;
  cursor: pointer; font-family: inherit; margin-top: 8px;
}
.restart-btn:hover { background: #333; }

@media (max-width: 560px) {
  .reel { width: 100px; height: 100px; }
  .spin-btn { padding: 12px 32px; font-size: 14px; }
  .spin-hint { display: none; }
  .reels-row { gap: 6px; }
}
</style>
</head>
<body>

<header>
  <a class="back" href="/">← Study Hub</a>
  <span class="logo">Furry Slots</span>
  <div class="header-right">
    <div class="balance-display">
      <span class="label">Balance</span>
      <span id="balance-display">$1000</span>
    </div>
  </div>
</header>

<main>

  <div id="loading-screen" style="display:none"></div>

  <!-- Machine -->
  <div id="machine">
    <div class="machine-frame">
      <div class="machine-title">🎰 Furry Slots 🎰</div>

      <div class="reels-row">
        <div class="reel-wrap">
          <div class="reel" id="reel-0"><div class="reel-emoji">🦊</div></div>
          <div class="reel-label" id="label-0">—</div>
        </div>
        <div class="reel-wrap">
          <div class="reel" id="reel-1"><div class="reel-emoji">🐺</div></div>
          <div class="reel-label" id="label-1">—</div>
        </div>
        <div class="reel-wrap">
          <div class="reel" id="reel-2"><div class="reel-emoji">🐱</div></div>
          <div class="reel-label" id="label-2">—</div>
        </div>
      </div>

      <div class="result-area" id="result-area"></div>
      <div class="slot-history" id="slot-history"></div>
      <div class="slot-session" id="slot-session"></div>
    </div>

    <div class="controls">
      <div class="bet-row">
        <span class="bet-label">Bet:</span>
        <button class="bet-btn" data-bet="5">$5</button>
        <button class="bet-btn selected" data-bet="10">$10</button>
        <button class="bet-btn" data-bet="25">$25</button>
        <button class="bet-btn" data-bet="50">$50</button>
        <button class="bet-btn" data-bet="100">$100</button>
      </div>
      <div class="spin-row">
        <button class="spin-btn" id="spin-btn">
          Spin
          <span class="spin-hint">Space</span>
        </button>
        <button class="auto-btn" id="auto-btn">AUTO</button>
      </div>
    </div>
  </div>

  <!-- Broke screen -->
  <div id="broke-screen">
    <div style="font-size:48px">😿</div>
    <h2>You're broke!</h2>
    <p>All out of money. Better luck next time.</p>
    <button class="restart-btn" id="restart-btn">Start over with $1,000</button>
  </div>

  <!-- Paytable -->
  <div class="paytable" id="paytable" style="display:none">
    <div class="paytable-title">Paytable</div>
    <div class="paytable-row">
      <div class="pt-symbols" id="pt-jackpot">🐲 🐲 🐲</div>
      <div class="pt-payout">×8</div>
      <div class="pt-desc">JACKPOT</div>
    </div>
    <div class="paytable-row">
      <div class="pt-symbols">Any 3 matching</div>
      <div class="pt-payout">×3</div>
      <div class="pt-desc">Win</div>
    </div>
    <div class="paytable-row">
      <div class="pt-symbols">Anything else</div>
      <div class="pt-payout">×0</div>
      <div class="pt-desc">Lose</div>
    </div>
  </div>

</main>

<div id="toast"></div>

<script>
(function () {

// ── Config ─────────────────────────────────────────────────────────────────

const SYMBOLS = [
  { key: 'fox',    label: 'Fox',    emoji: '🦊', weight: 65 },
  { key: 'wolf',   label: 'Wolf',   emoji: '🐺', weight: 55 },
  { key: 'cat',    label: 'Cat',    emoji: '🐱', weight: 55 },
  { key: 'bunny',  label: 'Bunny',  emoji: '🐰', weight: 40 },
  { key: 'deer',   label: 'Deer',   emoji: '🦌', weight: 20 },
  { key: 'dragon', label: 'Dragon', emoji: '🐲', weight: 1  },
];

const TOTAL_WEIGHT = SYMBOLS.reduce((s, sym) => s + sym.weight, 0);

const LOSS_TAUNTS = [
  [5,  '🌡️ Machine is heating up...'],
  [8,  '💀 You\'re due for a win soon...'],
  [12, '😤 SO close every time, huh?'],
  [16, '🎰 The jackpot HAS to drop soon...'],
  [20, '😈 Still here? Absolute respect.'],
  [25, '👀 This machine is RIGGED... or are you?'],
];

// ── State ──────────────────────────────────────────────────────────────────

let balance          = localStorage.getItem('rys-bal') === '∞' ? Infinity : (parseInt(localStorage.getItem('rys-bal') || '0', 10) || 1000);
let bet              = 10;
let spinning         = false;
let toastTimer       = null;
let consecutiveLosses = 0;
let autoSpinActive   = false;

// ── Utils ──────────────────────────────────────────────────────────────────

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

function saveBalance() {
  if (balance !== Infinity) {
    localStorage.setItem('rys-bal', String(balance));
    if (window.RYS) window.RYS.setBal(balance);
  }
  document.getElementById('balance-display').textContent = balance === Infinity
    ? (window.RYS ? window.RYS.fmtDisp() : '∞')
    : '$' + balance;
}

function pickSymbol() {
  let r = Math.random() * TOTAL_WEIGHT;
  for (const sym of SYMBOLS) {
    r -= sym.weight;
    if (r <= 0) return sym;
  }
  return SYMBOLS[0];
}

// Set reel display
function setReelDisplay(reelEl, symKey) {
  const sym = SYMBOLS.find(s => s.key === symKey);
  const emoji = reelEl.querySelector('.reel-emoji');
  if (emoji) { emoji.style.display = 'flex'; emoji.textContent = sym?.emoji || '?'; }
}

// ── Spin logic ─────────────────────────────────────────────────────────────

function spinReel(reelIdx, resultKey, stopDelay) {
  return new Promise(resolve => {
    const reel = document.getElementById('reel-' + reelIdx);
    reel.classList.add('spinning');

    // Rapid image cycling
    const interval = setInterval(() => {
      const sym = pickSymbol();
      setReelDisplay(reel, sym.key);
    }, 90);

    setTimeout(() => {
      clearInterval(interval);
      setReelDisplay(reel, resultKey);
      reel.classList.remove('spinning');
      reel.classList.add('just-stopped');
      setTimeout(() => reel.classList.remove('just-stopped'), 400);
      document.getElementById('label-' + reelIdx).textContent =
        SYMBOLS.find(s => s.key === resultKey)?.label || '';
      resolve();
    }, stopDelay);
  });
}

function checkWin(results) {
  const [a, b, c] = results;
  if (a === b && b === c) return { type: a === 'dragon' ? 'jackpot' : 'three', keys: [a,b,c] };
  if (a === b || b === c || a === c) return { type: 'two', keys: results };
  return { type: 'none', keys: results };
}

// ── Session & history tracking ──────────────────────────────────────────────

const HIST_KEY = 'rys-slot-history';
const SESS_KEY = 'rys-slot-session';

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch(_) { return []; }
}
function pushHistory(type) {
  const hist = loadHistory();
  hist.push(type);
  if (hist.length > 14) hist.shift();
  localStorage.setItem(HIST_KEY, JSON.stringify(hist));
  renderHistory();
}
function renderHistory() {
  const hist = loadHistory();
  const el = document.getElementById('slot-history');
  if (!el) return;
  el.innerHTML = '';
  hist.forEach((t, i) => {
    const d = document.createElement('div');
    d.className = 'hist-dot ' + (t==='j'?'jackpot': t==='w'?'win': t==='m'?'near': 'loss');
    if (i === hist.length - 1) d.classList.add('hist-new');
    d.title = t==='j'?'Jackpot!': t==='w'?'Win': t==='m'?'Near miss': 'Loss';
    el.appendChild(d);
  });
}
function getSessionData() {
  try { return JSON.parse(localStorage.getItem(SESS_KEY) || '{}'); } catch(_) { return {}; }
}
function updateSessionData(isWin, amount) {
  const s = getSessionData();
  s.spins = (s.spins || 0) + 1;
  if (isWin) {
    s.wins = (s.wins || 0) + 1;
    s.biggestWin = Math.max(s.biggestWin || 0, amount);
  }
  localStorage.setItem(SESS_KEY, JSON.stringify(s));
  renderSessionStats();
}
function renderSessionStats() {
  const s = getSessionData();
  const el = document.getElementById('slot-session');
  if (!el || !s.spins) return;
  const parts = [s.spins + ' spins', (s.wins || 0) + ' wins'];
  if (s.biggestWin > 0) parts.push('best: $' + s.biggestWin);
  el.textContent = 'Session · ' + parts.join(' · ');
}

// ── Win/loss result display ─────────────────────────────────────────────────

function showResult(win, betAmt) {
  const area = document.getElementById('result-area');
  let html = '';
  let winAmt = 0;

  if (win.type === 'jackpot') {
    winAmt = betAmt * 8;
    html = `<span class="result-msg jackpot">🎉 JACKPOT! +$${winAmt}</span>`;
    spawnJackpotBurst();
    consecutiveLosses = 0;
    pushHistory('j');
    updateSessionData(true, winAmt);
    if (window.RYS) {
      window.RYS.trackWin(winAmt);
      window.RYS.addWin(winAmt);
      const streak = window.RYS.streak();
      if (streak > 1) setTimeout(() => showToast('🔥 ' + streak + '-win streak!'), 900);
    }
  } else if (win.type === 'three') {
    winAmt = betAmt * 3;
    html = `<span class="result-msg win">🎊 Three of a kind! +$${winAmt}</span>`;
    floatWin(winAmt);
    consecutiveLosses = 0;
    pushHistory('w');
    updateSessionData(true, winAmt);
    if (window.RYS) {
      window.RYS.trackWin(winAmt);
      window.RYS.addWin(winAmt);
      const streak = window.RYS.streak();
      if (streak > 1) setTimeout(() => showToast('🔥 ' + streak + '-win streak!'), 700);
    }
  } else if (win.type === 'two') {
    // Near-miss — visually tantalizing, no payout
    html = `<span class="result-msg near">😤 SO CLOSE!</span>`;
    consecutiveLosses++;
    pushHistory('m');
    updateSessionData(false, 0);
    if (window.RYS) window.RYS.trackLoss();
    // Highlight the matching pair in orange
    const [a, b, c] = win.keys;
    [[0, a===b||a===c], [1, a===b||b===c], [2, b===c||a===c]].forEach(([i, match]) => {
      if (match) {
        const r = document.getElementById('reel-' + i);
        r.classList.add('near-winner');
        setTimeout(() => r.classList.remove('near-winner'), 2200);
      }
    });
  } else {
    html = `<span class="result-msg lose">No match.</span>`;
    consecutiveLosses++;
    pushHistory('n');
    updateSessionData(false, 0);
    if (window.RYS) window.RYS.trackLoss();
  }

  area.innerHTML = html;
  if (balance !== Infinity && winAmt > 0) { balance += winAmt; saveBalance(); }

  // Win glow on all reels
  if (win.type === 'jackpot' || win.type === 'three') {
    for (let i = 0; i < 3; i++) {
      document.getElementById('reel-' + i).classList.add('winner');
      setTimeout(() => document.getElementById('reel-' + i).classList.remove('winner'), 2600);
    }
  }

  // Loss streak taunts
  if (win.type !== 'jackpot' && win.type !== 'three') {
    for (const [threshold, msg] of LOSS_TAUNTS) {
      if (consecutiveLosses === threshold) { setTimeout(() => showToast(msg), 400); break; }
    }
  }
}

function checkPairIncludes(keys, idx) {
  const [a,b,c] = keys;
  if (idx === 0) return a === b || a === c;
  if (idx === 1) return a === b || b === c;
  if (idx === 2) return a === c || b === c;
  return false;
}

function floatWin(amount) {
  const spinBtn = document.getElementById('spin-btn');
  const rect = spinBtn.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'float-win';
  el.textContent = '+$' + amount;
  el.style.left = (rect.left + rect.width/2) + 'px';
  el.style.top  = (rect.top - 10) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

function spawnJackpotBurst() {
  const center = document.querySelector('.reels-row');
  const rect = center.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  const particles = ['🎉','⭐','💫','✨','🌟','🎊','💎','🏆'];
  for (let i = 0; i < 16; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'jp-particle';
      const angle = (i / 16) * Math.PI * 2;
      const dist = 30 + Math.random() * 20;
      const bx = Math.round(Math.cos(angle) * dist);
      const by = Math.round(Math.sin(angle) * dist);
      el.style.setProperty('--jx', bx + 'px');
      el.style.setProperty('--jy', by + 'px');
      el.style.left = cx + 'px';
      el.style.top  = cy + 'px';
      el.textContent = particles[i % particles.length];
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1200);
    }, i * 40);
  }
  // Also do a float
  floatWin(bet * 20);
}

async function doSpin() {
  if (spinning) return;

  spinning = true;
  document.getElementById('spin-btn').disabled = true;
  document.getElementById('result-area').innerHTML = '';

  // Deduct bet (skip if infinite)
  if (balance !== Infinity) { balance -= bet; saveBalance(); }

  // Clear labels & winner classes
  for (let i = 0; i < 3; i++) {
    document.getElementById('label-' + i).textContent = '…';
    document.getElementById('reel-' + i).classList.remove('winner', 'near-winner');
  }

  // Pick results
  let results = [pickSymbol().key, pickSymbol().key, pickSymbol().key];

  // Near-miss rigging: 28% of no-match spins → force a visual 2-symbol match
  if (checkWin(results).type === 'none' && Math.random() < 0.28) {
    if (Math.random() < 0.5) results[1] = results[0]; // match left pair
    else                      results[2] = results[1]; // match right pair
  }

  // Spin reels sequentially
  await Promise.all([
    spinReel(0, results[0], 1400),
    spinReel(1, results[1], 2000),
    spinReel(2, results[2], 2600),
  ]);

  // Evaluate
  const win = checkWin(results);
  showResult(win, bet);

  spinning = false;
  document.getElementById('spin-btn').disabled = false;

  // Check broke (never if infinite)
  if (balance !== Infinity && balance < Math.min(...[5, 10, 25, 50])) {
    setTimeout(checkBroke, 600);
  }

  // Auto-spin continuation
  if (autoSpinActive) {
    setTimeout(() => { if (autoSpinActive) doSpin(); }, 750);
  }
}

function checkBroke() {
  if (balance !== Infinity && balance <= 0) {
    document.getElementById('machine').classList.remove('ready');
    document.getElementById('machine').style.display = 'none';
    document.getElementById('paytable').style.display = 'none';
    document.getElementById('broke-screen').style.display = 'flex';
  }
}

// ── Bet buttons ────────────────────────────────────────────────────────────

document.querySelectorAll('.bet-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (spinning) return;
    bet = parseInt(btn.dataset.bet);
    document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
  });
});

// ── Spin button & spacebar ─────────────────────────────────────────────────

document.getElementById('spin-btn').addEventListener('click', doSpin);

document.getElementById('auto-btn').addEventListener('click', () => {
  autoSpinActive = !autoSpinActive;
  const btn = document.getElementById('auto-btn');
  btn.textContent = autoSpinActive ? 'STOP' : 'AUTO';
  btn.classList.toggle('active', autoSpinActive);
  if (autoSpinActive && !spinning) doSpin();
});

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.repeat) {
    e.preventDefault();
    if (!autoSpinActive) doSpin();
  }
});

// ── Restart ────────────────────────────────────────────────────────────────

document.getElementById('restart-btn').addEventListener('click', () => {
  balance = 1000;
  saveBalance();
  document.getElementById('broke-screen').style.display = 'none';
  document.getElementById('machine').style.display = '';
  document.getElementById('machine').classList.add('ready');
  document.getElementById('paytable').style.display = '';
});

// ── Init ───────────────────────────────────────────────────────────────────

(() => {
  saveBalance();

  // Show initial symbols
  for (let i = 0; i < 3; i++) {
    const sym = pickSymbol();
    setReelDisplay(document.getElementById('reel-' + i), sym.key);
    document.getElementById('label-' + i).textContent = sym.label;
  }

  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('machine').classList.add('ready');
  document.getElementById('paytable').style.display = '';

  // Check if already broke from a previous session
  if (balance !== Infinity && balance <= 0) { checkBroke(); }

  // Restore history and session
  renderHistory();
  renderSessionStats();
})();

})();
</script>
