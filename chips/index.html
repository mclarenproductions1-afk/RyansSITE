<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chips — Cost Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: #fff;
    color: #111;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ─────────────────────────────────────────────────── */
  header {
    background: #fff;
    border-bottom: 1px solid #e5e5e5;
    padding: 0 clamp(1rem, 4vw, 2.5rem);
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .back-link {
    font-size: 0.82rem;
    color: #888;
    text-decoration: none;
    font-weight: 500;
    letter-spacing: -0.01em;
    transition: color 0.15s;
  }
  .back-link:hover { color: #111; }
  .logo { font-size: 0.97rem; font-weight: 600; letter-spacing: -0.02em; color: #111; }
  .admin-link {
    font-size: 0.78rem;
    color: #888;
    text-decoration: none;
    font-weight: 500;
    padding: 5px 10px;
    border: 1px solid #e5e5e5;
    border-radius: 4px;
    transition: all 0.15s;
    letter-spacing: -0.01em;
  }
  .admin-link:hover { border-color: #111; color: #111; }

  /* ── Main ───────────────────────────────────────────────────── */
  main {
    padding: clamp(1.25rem, 4vw, 2.5rem) clamp(1rem, 4vw, 2.5rem);
    max-width: 860px;
    margin: 0 auto;
    width: 100%;
  }

  /* ── Next session banner ─────────────────────────────────────── */
  .next-banner {
    background: #111;
    border-radius: 6px;
    padding: 16px 20px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .next-banner-label {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #888;
    margin-bottom: 2px;
  }
  .next-banner-title {
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.02em;
  }
  .next-banner-note {
    font-size: 0.78rem;
    color: #aaa;
    text-align: right;
  }
  .next-banner-note strong { color: #fff; font-weight: 600; }

  /* ── Last session strip ──────────────────────────────────────── */
  .last-session {
    background: #fafafa;
    border: 1px solid #e5e5e5;
    border-radius: 6px;
    padding: 14px 18px;
    margin-bottom: 24px;
  }
  .last-session-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .last-session-title {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #888;
  }
  .last-session-week {
    font-size: 0.72rem;
    color: #bbb;
    font-weight: 500;
  }
  .last-session-rows {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .ls-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.82rem;
  }
  .ls-name { font-weight: 600; width: 72px; flex-shrink: 0; }
  .ls-tag {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 6px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .ls-tag.attended { background: #f0f0f0; color: #555; }
  .ls-tag.absent   { background: #fafafa; border: 1px solid #e5e5e5; color: #bbb; }
  .ls-paid { color: #111; flex: 1; }
  .ls-share { color: #888; }
  .ls-diff { font-weight: 600; min-width: 52px; text-align: right; }
  .ls-diff.over  { color: #16a34a; }
  .ls-diff.under { color: #dc2626; }
  .ls-diff.even  { color: #888; }
  .ls-absent-dash { color: #bbb; flex: 1; font-size: 0.8rem; }

  /* ── Section label ──────────────────────────────────────────── */
  .section-label {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #888;
    margin-bottom: 12px;
    padding-left: 2px;
  }

  /* ── Person grid ────────────────────────────────────────────── */
  .person-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
    gap: 10px;
  }

  /* ── Person card ────────────────────────────────────────────── */
  .person-card {
    display: block;
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 6px;
    padding: 18px 20px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s;
    animation: cardIn .2s ease both;
  }
  .person-card:hover { border-color: #111; }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-name {
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: #888;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 0.65rem;
  }

  /* The hero number — what they bring next session */
  .card-payment {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.05em;
    line-height: 1;
    color: #111;
    margin-bottom: 3px;
  }
  .card-payment-label {
    font-size: 0.72rem;
    font-weight: 500;
    color: #888;
    margin-bottom: 14px;
  }

  /* Absent state */
  .card-absent {
    font-size: 1.1rem;
    font-weight: 700;
    color: #ccc;
    letter-spacing: -0.02em;
    margin-bottom: 3px;
    line-height: 1;
  }
  .card-absent-label {
    font-size: 0.72rem;
    color: #bbb;
    margin-bottom: 14px;
  }

  /* Balance — secondary info */
  .card-balance {
    padding-top: 12px;
    border-top: 1px solid #f0f0f0;
    font-size: 0.73rem;
    color: #bbb;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-balance-label { }
  .card-balance-val { font-weight: 600; }
  .card-balance-val.pos { color: #16a34a; }
  .card-balance-val.neg { color: #dc2626; }
  .card-balance-val.zer { color: #bbb; }

  /* ── Loading ────────────────────────────────────────────────── */
  .spinner {
    width: 28px; height: 28px;
    border: 2px solid #e5e5e5;
    border-top-color: #111;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin: 4rem auto 1rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-msg { text-align: center; color: #888; font-size: 0.85rem; }

  /* ── Mobile ─────────────────────────────────────────────────── */
  @media (max-width: 540px) {
    .person-grid { grid-template-columns: repeat(2, 1fr); }
    .next-banner { flex-direction: column; align-items: flex-start; }
    .next-banner-note { text-align: left; }
  }

  /* ── Scrollbar ──────────────────────────────────────────────── */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #e5e5e5; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #ccc; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <a class="back-link" href="/">← Study Hub</a>
    <span class="logo">Chips</span>
  </div>
  <a class="admin-link" href="/chips/admin">Admin</a>
</header>

<main>
  <div class="spinner" id="spinner"></div>
  <p class="loading-msg" id="loading-msg">Loading…</p>

  <div id="content" style="display:none">

    <!-- Next session banner -->
    <div class="next-banner" id="next-banner">
      <div>
        <div class="next-banner-label">Next session</div>
        <div class="next-banner-title" id="banner-title">Week —</div>
      </div>
      <div class="next-banner-note" id="banner-note"></div>
    </div>

    <!-- Last session recap -->
    <div class="last-session" id="last-session" style="display:none">
      <div class="last-session-header">
        <span class="last-session-title">Last session</span>
        <span class="last-session-week" id="last-session-week"></span>
      </div>
      <div class="last-session-rows" id="last-session-rows"></div>
    </div>

    <!-- Pay next session cards -->
    <div class="section-label" id="section-label">Who pays what</div>
    <div class="person-grid" id="person-grid"></div>

  </div>
</main>

<script src="chips.js"></script>
<script>
let _landingData = null;
let _landingSHA  = null;

(async function() {
  try {
    const result = await loadData();
    _landingData = result.data;
    _landingSHA  = result.sha;
    renderLanding(_landingData);
    startSheetsPolling(
      () => _landingData,
      async (sheetsData) => {
        try {
          _landingSHA  = await saveData(sheetsData, _landingSHA);
          _landingData = sheetsData;
          renderLanding(sheetsData);
        } catch (e) { console.warn("Sheets→GitHub sync failed:", e.message); }
      }
    );
  } catch (e) {
    document.getElementById("spinner").style.display    = "none";
    document.getElementById("loading-msg").textContent = "Error loading data: " + e.message;
  }
})();

function renderLanding(data) {
  document.getElementById("spinner").style.display     = "none";
  document.getElementById("loading-msg").style.display = "none";
  document.getElementById("content").style.display     = "";

  const nextWeekAtt = getNextWeekAttendance(data);
  const { payments, balances } = computeSuggestedPayments(data.weeks, nextWeekAtt);
  const nextAttendees = PEOPLE.filter(p => nextWeekAtt[p] === 1);

  /* ── Next session banner ────────────────────────────────────── */
  document.getElementById("banner-title").textContent = `Week ${data.currentWeek}`;

  const tqNote = data.nextWeekTomQuincyAttending
    ? `${nextAttendees.length} people · $13 bowl`
    : `<strong>Tom &amp; Quincy absent</strong> · ${nextAttendees.length} people · $13 bowl`;
  document.getElementById("banner-note").innerHTML = tqNote;

  /* ── Last session recap ─────────────────────────────────────── */
  const lastSessionEl  = document.getElementById("last-session");
  const lastSessionRows = document.getElementById("last-session-rows");
  const lastSessionWeek = document.getElementById("last-session-week");

  if (data.weeks.length > 0) {
    // Most recently entered week
    const last = data.weeks[data.weeks.length - 1];
    const n    = PEOPLE.filter(p => last.attendance[p] === 1).length;
    const share = n > 0 ? BOWL_COST / n : 0;

    lastSessionWeek.textContent = `Week ${last.weekNumber}`;
    lastSessionEl.style.display = "";

    lastSessionRows.innerHTML = PEOPLE.map(p => {
      const attended = last.attendance[p] === 1;
      const paid     = last.payments[p] || 0;
      const diff     = attended ? paid - share : 0;
      const diffClass = diff > 0.005 ? "over" : diff < -0.005 ? "under" : "even";
      const diffLabel = diff > 0.005 ? `+$${diff.toFixed(2)}` : diff < -0.005 ? `-$${Math.abs(diff).toFixed(2)}` : "even";

      if (!attended) {
        return `
          <div class="ls-row">
            <span class="ls-name">${escHtml(p)}</span>
            <span class="ls-tag absent">Absent</span>
            <span class="ls-absent-dash">—</span>
          </div>`;
      }
      return `
        <div class="ls-row">
          <span class="ls-name">${escHtml(p)}</span>
          <span class="ls-tag attended">Attended</span>
          <span class="ls-paid">paid $${paid.toFixed(2)}</span>
          <span class="ls-share">share $${share.toFixed(2)}</span>
          <span class="ls-diff ${diffClass}">${diffLabel}</span>
        </div>`;
    }).join("");
  } else {
    lastSessionEl.style.display = "none";
  }

  /* ── Person cards ───────────────────────────────────────────── */
  const nextWk = data.currentWeek;
  document.getElementById("section-label").textContent =
    `Pay at week ${nextWk}`;

  document.getElementById("person-grid").innerHTML = PEOPLE.map(name => {
    const balance  = balances[name];
    const payment  = payments[name];
    const isAbsent = nextWeekAtt[name] === 0;

    const bClass = balance > 0.005 ? "pos" : balance < -0.005 ? "neg" : "zer";
    const bLabel = balance > 0.005 ? "credit" : balance < -0.005 ? "owes" : "even";

    const paymentBlock = isAbsent
      ? `<div class="card-absent">Absent</div>
         <div class="card-absent-label">not playing next week</div>`
      : `<div class="card-payment">$${payment.toFixed(2)}</div>
         <div class="card-payment-label">bring next session</div>`;

    return `
      <a class="person-card" href="/chips/${name}">
        <div class="card-name">${escHtml(name)}</div>
        ${paymentBlock}
        <div class="card-balance">
          <span class="card-balance-label">balance</span>
          <span class="card-balance-val ${bClass}">${fmtBalance(balance)} <span style="font-weight:400;color:#bbb">${bLabel}</span></span>
        </div>
      </a>`;
  }).join("");
}
</script>
</body>
</html>
