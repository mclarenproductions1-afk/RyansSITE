<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission Uncrossable</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:     #0a0c1e;
  --panel:  #10122a;
  --card:   #161932;
  --border: rgba(255,255,255,0.07);
  --text:   #fff;
  --muted:  #5a6490;
  --green:  #1ecb4f;
  --yellow: #f5c842;
  --purple: #6c5dd3;
  --red:    #ef4444;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  padding: 12px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  background: var(--panel);
}
.back { font-size: 13px; color: var(--muted); text-decoration: none; transition: color 0.1s; }
.back:hover { color: var(--text); }
.title { font-size: 14px; font-weight: 600; }
.hint  { font-size: 12px; color: var(--muted); margin-left: auto; }

/* Canvas fills the middle */
#canvas-wrap {
  flex: 1;
  min-height: 0;
  overflow: hidden;
  position: relative;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* ── Controls panel ─────────────────────────────────────── */
.ctrl-panel {
  flex-shrink: 0;
  background: var(--panel);
  border-top: 1px solid var(--border);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 20px;
}

.ctrl-group {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.ctrl-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}

/* Balance */
.bal-val {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

/* Bet input */
.bet-wrap {
  display: flex;
  align-items: stretch;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  height: 40px;
}
.bet-prefix {
  padding: 0 10px;
  display: flex;
  align-items: center;
  font-size: 14px;
  color: var(--muted);
  border-right: 1px solid var(--border);
}
#bet-inp {
  width: 90px;
  padding: 0 10px;
  background: transparent;
  border: none;
  outline: none;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  font-family: inherit;
}
#bet-inp::-webkit-inner-spin-button { display: none; }
.bet-adj {
  display: flex;
  border-left: 1px solid var(--border);
}
.bet-adj button {
  width: 36px;
  background: none;
  border: none;
  border-right: 1px solid var(--border);
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: color 0.1s, background 0.1s;
}
.bet-adj button:last-child { border-right: none; }
.bet-adj button:hover { color: var(--text); background: rgba(255,255,255,0.05); }
.bet-adj button:disabled { opacity: 0.3; cursor: not-allowed; }

/* Multiplier (during play, replaces bet) */
.mult-val {
  font-size: 24px;
  font-weight: 700;
  color: var(--green);
  letter-spacing: -0.5px;
  line-height: 1;
}
.mult-sub {
  font-size: 11px;
  color: var(--green);
  opacity: 0.8;
}

/* Difficulty */
.diff-wrap {
  display: flex;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  height: 40px;
}
.diff-btn {
  padding: 0 14px;
  background: none;
  border: none;
  border-right: 1px solid var(--border);
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  transition: color 0.12s, background 0.12s;
  white-space: nowrap;
}
.diff-btn:last-child { border-right: none; }
.diff-btn:hover { color: var(--text); }
.diff-btn.active { background: var(--purple); color: #fff; }

/* Spacer */
.spacer { flex: 1; }

/* Status text */
.status {
  font-size: 13px;
  color: var(--muted);
  max-width: 220px;
  text-align: right;
}
.status.win  { color: var(--green); font-weight: 600; }
.status.lose { color: var(--red);   font-weight: 600; }

/* Action buttons */
.btn-start {
  height: 40px;
  padding: 0 28px;
  background: var(--yellow);
  color: #111;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  transition: opacity 0.1s, transform 0.08s;
}
.btn-start:hover { opacity: 0.9; }
.btn-start:active { transform: scale(0.97); }
.btn-start:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

.btn-hop {
  height: 40px;
  padding: 0 28px;
  background: var(--purple);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  transition: opacity 0.1s, transform 0.08s;
}
.btn-hop:hover { opacity: 0.85; }
.btn-hop:active { transform: scale(0.97); }
.btn-hop:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

.btn-co {
  height: 40px;
  padding: 0 24px;
  background: var(--green);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  transition: opacity 0.1s, transform 0.08s;
}
.btn-co:hover { opacity: 0.85; }
.btn-co:active { transform: scale(0.97); }
.btn-co:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

@media (max-width: 720px) {
  .ctrl-panel { flex-wrap: wrap; gap: 10px; padding: 10px 16px; }
  .hint { display: none; }
  .diff-btn { padding: 0 8px; font-size: 12px; }
  .status { display: none; }
}
</style>
</head>
<body>

<header>
  <a class="back" href="/">← Home</a>
  <span class="title">Mission Uncrossable</span>
  <span class="hint">Space / click to hop · C to cash out</span>
</header>

<div id="canvas-wrap">
  <canvas id="canvas"></canvas>
</div>

<div class="ctrl-panel">

  <!-- Balance -->
  <div class="ctrl-group">
    <div class="ctrl-label">Balance</div>
    <div class="bal-val" id="bal-disp">$1,000</div>
  </div>

  <!-- Bet (idle) -->
  <div class="ctrl-group" id="bet-group">
    <div class="ctrl-label">Bet Amount</div>
    <div class="bet-wrap">
      <span class="bet-prefix">$</span>
      <input id="bet-inp" type="number" min="1" max="999999" value="10">
      <div class="bet-adj">
        <button onclick="adjBet(0.5)">½</button>
        <button onclick="adjBet(2)">2×</button>
        <button onclick="maxBet()">Max</button>
      </div>
    </div>
  </div>

  <!-- Live mult (playing) -->
  <div class="ctrl-group" id="mult-group" style="display:none">
    <div class="ctrl-label">Multiplier</div>
    <div class="mult-val" id="mult-disp">—</div>
    <div class="mult-sub" id="profit-disp"></div>
  </div>

  <!-- Difficulty -->
  <div class="ctrl-group" id="diff-group">
    <div class="ctrl-label">Difficulty</div>
    <div class="diff-wrap">
      <button class="diff-btn" data-d="easy"      onclick="setDiff('easy')">Easy</button>
      <button class="diff-btn" data-d="medium"    onclick="setDiff('medium')">Medium</button>
      <button class="diff-btn" data-d="hard"      onclick="setDiff('hard')">Hard</button>
      <button class="diff-btn active" data-d="daredevil" onclick="setDiff('daredevil')">Daredevil</button>
    </div>
  </div>

  <div class="spacer"></div>

  <div class="status" id="status">Place a bet and hit Start Game</div>

  <!-- Start (idle) -->
  <button class="btn-start" id="start-btn" onclick="startGame()">Start Game</button>

  <!-- Hop + Cashout (playing) -->
  <button class="btn-hop"  id="hop-btn"   onclick="hop()"     style="display:none">HOP! 🐔</button>
  <button class="btn-co"   id="co-btn"    onclick="cashOut()" style="display:none" disabled>Cash Out</button>

</div>

<script>
// ── Config ─────────────────────────────────────────────────────────────────────
const NL    = 8;
const SAFE  = 88;   // left safe zone (green/sidewalk) px in internal coords
const MULTS = [1.20, 1.60, 2.20, 3.20, 5.00, 8.00, 14.00, 25.00];

const DIFF_CFG = {
  easy:      { n: 1, spd: 1.0 },
  medium:    { n: 1, spd: 1.7 },
  hard:      { n: 2, spd: 2.6 },
  daredevil: { n: 2, spd: 4.2 },
};

const CAR_DEFS = [
  { col: '#d63031', roof: '#b02222', type: 'sedan' },
  { col: '#2980b9', roof: '#1a5f8a', type: 'sedan' },
  { col: '#f5c842', roof: '#c8a230', type: 'bus'   },
  { col: '#e67e22', roof: '#c05e10', type: 'suv'   },
  { col: '#27ae60', roof: '#1a7a44', type: 'sedan' },
  { col: '#8e44ad', roof: '#6a2d8a', type: 'suv'   },
  { col: '#16a085', roof: '#0e6b58', type: 'sedan' },
  { col: '#c0392b', roof: '#922b21', type: 'bus'   },
];

// Canvas
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
let   CW, CH, LW; // set on resize

function resize() {
  const wrap = document.getElementById('canvas-wrap');
  CW = wrap.clientWidth;
  CH = wrap.clientHeight;
  canvas.width  = CW;
  canvas.height = CH;
  LW = (CW - SAFE) / NL;
}

// ── State ──────────────────────────────────────────────────────────────────────
let bal, bet, gs = 'idle', lane, cars, diff = 'daredevil';
let cxFrom, cxTo, cxT, cxDur;
let cx;
let deathAlpha, deathTimer;
let lastTs = 0;
let shakeT = 0; // screen shake after death

// ── Helpers ────────────────────────────────────────────────────────────────────
function laneX(n) {
  if (n === 0) return SAFE / 2;
  return SAFE + LW * (n - 1) + LW / 2;
}
function isAnimating() { return cxT < cxDur; }
function ease(t)       { return 1 - (1-t)*(1-t); }

// ── Balance ────────────────────────────────────────────────────────────────────
function loadBal() {
  bal = window.RYS ? window.RYS.bal() : 1000;
  if (isNaN(bal) || bal < 1) bal = 1000;
}
function saveBal() { if (window.RYS) window.RYS.setBal(bal); }
function dispBal() {
  document.getElementById('bal-disp').textContent = '$' + bal.toLocaleString();
}

// ── Difficulty ─────────────────────────────────────────────────────────────────
function setDiff(d) {
  diff = d;
  document.querySelectorAll('.diff-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.d === d));
}

// ── Cars ───────────────────────────────────────────────────────────────────────
function initCars() {
  cars = [];
  const { n, spd } = DIFF_CFG[diff];
  for (let ln = 1; ln <= NL; ln++) {
    const def = CAR_DEFS[(ln - 1) % CAR_DEFS.length];
    const dir = ln % 2 === 0 ? 1 : -1;
    const isLong = def.type === 'bus';
    for (let j = 0; j < n; j++) {
      const carH = isLong ? CH * 0.22 : CH * 0.16;
      const gap  = CH / n;
      cars.push({
        lane: ln, dir,
        y:    gap * j + Math.random() * gap * 0.7,
        h:    carH,
        spd:  spd * (0.82 + Math.random() * 0.36),
        col:  def.col,
        roof: def.roof,
        type: def.type,
      });
    }
  }
}

function moveCars(dt) {
  for (const c of cars) {
    c.y += c.spd * c.dir * CH * dt;
    if (c.dir ===  1 && c.y >  CH + c.h + 10) c.y = -c.h - 10;
    if (c.dir === -1 && c.y < -c.h - 10)      c.y =  CH + c.h + 10;
  }
}

// ── Collision ──────────────────────────────────────────────────────────────────
function hit(targetLane) {
  const mid = CH / 2;
  const cr  = CH * 0.065; // chicken radius (vertical)
  for (const c of cars) {
    if (c.lane !== targetLane) continue;
    if (c.y < mid + cr && c.y + c.h > mid - cr) return true;
  }
  return false;
}

// ── Actions ────────────────────────────────────────────────────────────────────
function startGame() {
  bet = Math.max(1, Math.min(bal, parseInt(document.getElementById('bet-inp').value, 10) || 10));
  if (bal < 1) { setStatus('No balance!', ''); return; }
  bal -= bet; saveBal(); dispBal();
  lane = 0;
  cx = laneX(0); cxFrom = cx; cxTo = cx; cxT = cxDur = 1;
  deathAlpha = 0; deathTimer = 0; shakeT = 0;
  initCars();
  gs = 'playing';
  showPlay();
  updMult();
  setStatus('Click, tap, or Space to hop!', '');
}

function hop() {
  if (gs !== 'playing' || isAnimating()) return;
  const next = lane + 1;
  if (next > NL) {
    animX(laneX(NL) + LW * 0.6, 0.22);
    lane = NL + 1;
    setTimeout(doWin, 320);
    return;
  }
  if (hit(next)) {
    lane = next;
    animX(laneX(next), 0.12);
    setTimeout(doDead, 180);
    return;
  }
  lane = next;
  animX(laneX(next), 0.18);
  updMult();
}

function cashOut() {
  if (gs !== 'playing' || lane === 0 || isAnimating()) return;
  const m   = MULTS[lane - 1];
  const win = Math.floor(bet * m);
  bal += win; saveBal(); dispBal();
  gs = 'idle';
  showIdle();
  setStatus('Cashed out at ' + m.toFixed(2) + '× · +$' + win.toLocaleString(), 'win');
}

function doDead() {
  gs = 'dead'; deathAlpha = 1; deathTimer = 1.6; shakeT = 0.3;
  showIdle();
  setStatus('Splat! Lost $' + bet.toLocaleString(), 'lose');
}

function doWin() {
  const m   = MULTS[NL - 1];
  const win = Math.floor(bet * m);
  bal += win; saveBal(); dispBal();
  gs = 'idle';
  showIdle();
  setStatus('You made it! +$' + win.toLocaleString() + ' at ' + m.toFixed(2) + '×', 'win');
}

function animX(to, dur) {
  cxFrom = cx; cxTo = to; cxT = 0; cxDur = dur;
}

// ── UI ─────────────────────────────────────────────────────────────────────────
function showIdle() {
  document.getElementById('bet-group').style.display  = '';
  document.getElementById('mult-group').style.display = 'none';
  document.getElementById('diff-group').style.display = '';
  document.getElementById('start-btn').style.display  = '';
  document.getElementById('hop-btn').style.display    = 'none';
  document.getElementById('co-btn').style.display     = 'none';
  document.querySelectorAll('.bet-adj button,.diff-btn').forEach(b => b.disabled = false);
  document.getElementById('bet-inp').disabled = false;
  dispBal();
}

function showPlay() {
  document.getElementById('bet-group').style.display  = 'none';
  document.getElementById('mult-group').style.display = '';
  document.getElementById('diff-group').style.display = 'none';
  document.getElementById('start-btn').style.display  = 'none';
  document.getElementById('hop-btn').style.display    = '';
  document.getElementById('co-btn').style.display     = '';
  document.getElementById('co-btn').disabled          = true;
}

function updMult() {
  const md = document.getElementById('mult-disp');
  const pd = document.getElementById('profit-disp');
  if (lane === 0) { md.textContent = '—'; pd.textContent = ''; return; }
  const m = MULTS[lane - 1];
  md.textContent = m.toFixed(2) + '×';
  pd.textContent = 'Cash out: $' + Math.floor(bet * m).toLocaleString();
  document.getElementById('co-btn').disabled = false;
}

function setStatus(txt, cls) {
  const el = document.getElementById('status');
  el.textContent = txt;
  el.className   = 'status' + (cls ? ' ' + cls : '');
}

function adjBet(f) {
  const inp = document.getElementById('bet-inp');
  inp.value = Math.max(1, Math.min(bal, Math.floor((parseFloat(inp.value) || 10) * f)));
}
function maxBet() { document.getElementById('bet-inp').value = bal; }

// ── Drawing ────────────────────────────────────────────────────────────────────
function rrect(x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.arcTo(x+w, y, x+w, y+r, r);
  ctx.lineTo(x+w, y+h-r);
  ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h);
  ctx.arcTo(x, y+h, x, y+h-r, r);
  ctx.lineTo(x, y+r);
  ctx.arcTo(x, y, x+r, y, r);
  ctx.closePath();
}

function drawCar(c) {
  const margin = LW * 0.12;
  const carX   = SAFE + (c.lane - 1) * LW + margin;
  const carW   = LW - margin * 2;
  const carY   = c.y;
  const carH   = c.h;

  // Body
  ctx.fillStyle = c.col;
  rrect(carX, carY, carW, carH, 7);
  ctx.fill();

  // Roof panel (slightly darker, inset)
  ctx.fillStyle = c.roof;
  const ri = carW * 0.18, rt = carH * 0.2;
  rrect(carX + ri, carY + rt, carW - ri*2, carH - rt*2, 4);
  ctx.fill();

  // Windshield
  const ww = carW * 0.65, wh = carH * 0.18;
  const wx = carX + (carW - ww) / 2;
  ctx.fillStyle = 'rgba(160,210,255,0.22)';
  if (c.dir === 1) {
    rrect(wx, carY + 6, ww, wh, 3);
  } else {
    rrect(wx, carY + carH - 6 - wh, ww, wh, 3);
  }
  ctx.fill();

  // Headlights
  const hlW = carW * 0.2, hlH = 5;
  const hlX = carX + (carW - hlW * 2 - 4) / 2;
  ctx.fillStyle = '#fffbe6';
  if (c.dir === 1) {
    ctx.fillRect(hlX,           carY + carH - 4, hlW, hlH);
    ctx.fillRect(hlX + hlW + 4, carY + carH - 4, hlW, hlH);
  } else {
    ctx.fillRect(hlX,           carY - 1, hlW, hlH);
    ctx.fillRect(hlX + hlW + 4, carY - 1, hlW, hlH);
  }

  // Taillights
  ctx.fillStyle = '#ff3333';
  const tlW = carW * 0.18, tlH = 4;
  const tlX = carX + (carW - tlW * 2 - 4) / 2;
  if (c.dir === 1) {
    ctx.fillRect(tlX,           carY - 1, tlW, tlH);
    ctx.fillRect(tlX + tlW + 4, carY - 1, tlW, tlH);
  } else {
    ctx.fillRect(tlX,           carY + carH - 3, tlW, tlH);
    ctx.fillRect(tlX + tlW + 4, carY + carH - 3, tlW, tlH);
  }

  // Wheels
  ctx.fillStyle = '#0a0c1e';
  const whl = 6, whh = 10;
  ctx.fillRect(carX - 2,          carY + carH * 0.18, whl, whh);
  ctx.fillRect(carX + carW - 4,   carY + carH * 0.18, whl, whh);
  ctx.fillRect(carX - 2,          carY + carH * 0.64, whl, whh);
  ctx.fillRect(carX + carW - 4,   carY + carH * 0.64, whl, whh);
}

function drawScene() {
  // ── Background ──
  ctx.fillStyle = '#0a0c1e';
  ctx.fillRect(0, 0, CW, CH);

  // ── Road lanes ──
  for (let i = 0; i < NL; i++) {
    ctx.fillStyle = i % 2 === 0 ? '#141736' : '#111430';
    ctx.fillRect(SAFE + i * LW, 0, LW, CH);
  }

  // ── Active lane highlight ──
  if (gs === 'playing' && lane > 0 && lane <= NL) {
    ctx.fillStyle = 'rgba(30,203,79,0.07)';
    ctx.fillRect(SAFE + (lane-1)*LW, 0, LW, CH);
  }

  // ── Manhole covers ──
  for (let i = 0; i < NL; i++) {
    const mx = SAFE + i * LW + LW / 2;
    const r  = Math.min(LW, CH) * 0.18;
    ctx.beginPath();
    ctx.arc(mx, CH / 2, r, 0, Math.PI * 2);
    ctx.fillStyle   = 'rgba(255,255,255,0.025)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth   = 1;
    ctx.stroke();
    // Cross lines on manhole
    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(mx-r,CH/2); ctx.lineTo(mx+r,CH/2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mx,CH/2-r); ctx.lineTo(mx,CH/2+r); ctx.stroke();
  }

  // ── Lane dividers (dashed vertical) ──
  ctx.setLineDash([CH * 0.04, CH * 0.03]);
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth   = 1;
  for (let i = 1; i < NL; i++) {
    const x = SAFE + i * LW;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, CH); ctx.stroke();
  }
  ctx.setLineDash([]);

  // ── Left safe zone (grass/sidewalk) ──
  ctx.fillStyle = '#1a5c30';
  ctx.fillRect(0, 0, SAFE, CH);
  // Sidewalk edge
  ctx.fillStyle = '#4a5568';
  ctx.fillRect(SAFE - 10, 0, 10, CH);
  // Curb highlight
  ctx.fillStyle = '#6b7280';
  ctx.fillRect(SAFE - 10, 0, 2, CH);
  // Grass texture stripes
  for (let y = 0; y < CH; y += CH * 0.08) {
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fillRect(0, y, SAFE - 10, CH * 0.04);
  }
  // Fire hydrant
  const hx = SAFE - 28, hy = CH / 2 + CH * 0.15;
  ctx.fillStyle = '#e63946';
  ctx.fillRect(hx - 5, hy - 14, 10, 14);
  ctx.fillStyle = '#c1121f';
  ctx.fillRect(hx - 7, hy - 17, 14, 5);
  ctx.fillRect(hx - 3, hy, 6, 5);

  // Bush
  const bx = SAFE - 30, by = CH / 2 - CH * 0.22;
  ctx.fillStyle = '#2d6a4f';
  ctx.beginPath(); ctx.arc(bx, by, 12, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#40916c';
  ctx.beginPath(); ctx.arc(bx-6, by+4, 8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(bx+6, by+3, 9, 0, Math.PI*2); ctx.fill();

  // ── Cars ──
  for (const c of cars) drawCar(c);

  // ── Multiplier labels in each lane ──
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  for (let ln = 1; ln <= NL; ln++) {
    const lx     = SAFE + (ln - 1) * LW + LW / 2;
    const passed = gs === 'playing' && lane >= ln;
    const active = gs === 'playing' && lane === ln;
    const fontSize = Math.max(10, Math.min(13, LW * 0.12));
    ctx.font      = (active ? '700 ' : '600 ') + fontSize + 'px Inter, sans-serif';
    ctx.fillStyle = active ? '#fff' : passed ? 'rgba(30,203,79,0.7)' : 'rgba(90,104,144,0.8)';
    ctx.fillText(MULTS[ln-1].toFixed(2) + '×', lx, CH - CH * 0.07);
  }

  // ── Direction arrows per lane ──
  ctx.font      = '11px Inter, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  for (let ln = 1; ln <= NL; ln++) {
    const lx  = SAFE + (ln - 1) * LW + LW / 2;
    const dir = ln % 2 === 0 ? '↓' : '↑';
    ctx.fillText(dir, lx, CH * 0.12);
    ctx.fillText(dir, lx, CH * 0.88);
  }

  // ── Chicken ──
  const chickenSize = Math.round(Math.min(LW, CH) * 0.22);
  ctx.save();
  if (gs === 'dead') ctx.globalAlpha = Math.max(0, deathAlpha);
  ctx.font         = chickenSize + 'px serif';
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🐔', cx, CH / 2);
  ctx.restore();

  // ── Finish line glow (right side) ──
  const grad = ctx.createLinearGradient(CW - 60, 0, CW, 0);
  grad.addColorStop(0, 'rgba(30,203,79,0)');
  grad.addColorStop(1, 'rgba(30,203,79,0.06)');
  ctx.fillStyle = grad;
  ctx.fillRect(CW - 60, 0, 60, CH);

  // ── Road border (right edge) ──
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth   = 1;
  ctx.beginPath(); ctx.moveTo(SAFE, 0); ctx.lineTo(SAFE, CH); ctx.stroke();
}

// ── Game loop ──────────────────────────────────────────────────────────────────
function tick(ts) {
  const dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs = ts;

  if (gs === 'playing' || gs === 'dead') moveCars(dt);

  // Chicken X animation
  if (cxT < cxDur) {
    cxT = Math.min(cxDur, cxT + dt);
    cx  = cxFrom + (cxTo - cxFrom) * ease(cxT / cxDur);
  } else {
    cx = cxTo;
  }

  // Death fade + reset
  if (gs === 'dead' && deathTimer > 0) {
    deathTimer -= dt;
    deathAlpha  = Math.max(0, deathTimer / 1.6);
    shakeT      = Math.max(0, shakeT - dt);
    if (deathTimer <= 0) { gs = 'idle'; deathAlpha = 0; cx = laneX(0); }
  }

  // Screen shake
  ctx.save();
  if (shakeT > 0) {
    const mag = shakeT * 5;
    ctx.translate(
      (Math.random() - 0.5) * mag,
      (Math.random() - 0.5) * mag
    );
  }

  drawScene();
  ctx.restore();

  requestAnimationFrame(tick);
}

// ── Events ─────────────────────────────────────────────────────────────────────
canvas.addEventListener('click', () => { if (gs === 'playing') hop(); });
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (gs === 'playing') hop();
}, { passive: false });

document.addEventListener('keydown', e => {
  if ((e.code === 'Space' || e.code === 'ArrowRight') && gs === 'playing') {
    e.preventDefault(); hop();
  }
  if (e.code === 'KeyC' && gs === 'playing') cashOut();
});

window.addEventListener('resize', () => {
  resize();
  if (!CW) return;
  if (gs === 'idle') cx = laneX(0);
});

// ── Boot ───────────────────────────────────────────────────────────────────────
resize();
loadBal();
initCars();
cx = laneX(0); cxFrom = cx; cxTo = cx; cxT = cxDur = 1;
gs = 'idle'; deathAlpha = 0; deathTimer = 0; shakeT = 0;
dispBal(); showIdle();
requestAnimationFrame(ts => { lastTs = ts; requestAnimationFrame(tick); });
</script>
<script src="/admin/control.js"></script>
</body>
</html>
