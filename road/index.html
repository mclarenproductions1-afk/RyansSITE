<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission Uncrossable</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#0a0c20; --panel:#0f1128; --border:rgba(255,255,255,0.07);
  --muted:#5a6490; --green:#1ecb4f; --yellow:#f5c842; --purple:#6c5dd3; --red:#ef4444;
}
html, body { height:100%; background:var(--bg); color:#fff; font-family:'Inter',system-ui,sans-serif; display:flex; flex-direction:column; overflow:hidden; }
header { padding:12px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; flex-shrink:0; background:var(--panel); }
.back { font-size:13px; color:var(--muted); text-decoration:none; } .back:hover { color:#fff; }
.title { font-size:14px; font-weight:600; }
.kbd { font-size:11px; color:var(--muted); margin-left:auto; }
.kbd kbd { display:inline-block; padding:1px 5px; border:1px solid rgba(255,255,255,0.12); border-radius:3px; font-size:10px; font-family:inherit; color:var(--muted); margin:0 1px; }
#canvas-wrap { flex:1; min-height:0; max-height:calc(100vh - 130px); overflow:hidden; cursor:pointer; }
canvas { display:block; width:100%; height:100%; }
.ctrl { flex-shrink:0; background:var(--panel); border-top:1px solid var(--border); padding:14px 20px; display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
.cg { display:flex; flex-direction:column; gap:4px; }
.cl { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
.bal-val { font-size:20px; font-weight:700; letter-spacing:-.5px; }
.bet-wrap { display:flex; align-items:stretch; height:40px; background:rgba(255,255,255,.04); border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.bet-pre { padding:0 10px; display:flex; align-items:center; font-size:14px; color:var(--muted); border-right:1px solid var(--border); }
#bet-inp { width:90px; padding:0 10px; background:transparent; border:none; outline:none; font-size:14px; font-weight:600; color:#fff; font-family:inherit; }
#bet-inp::-webkit-inner-spin-button { display:none; }
.bet-adj { display:flex; border-left:1px solid var(--border); }
.bet-adj button { width:38px; background:none; border:none; border-right:1px solid var(--border); color:var(--muted); font-size:11px; font-weight:600; cursor:pointer; font-family:inherit; transition:color .1s,background .1s; }
.bet-adj button:last-child { border-right:none; }
.bet-adj button:hover { color:#fff; background:rgba(255,255,255,.06); }
.bet-adj button:disabled { opacity:.35; cursor:not-allowed; }
.mult-big { font-size:24px; font-weight:700; color:var(--green); letter-spacing:-.5px; line-height:1; }
.mult-sub { font-size:11px; color:var(--green); opacity:.85; margin-top:2px; }
.diff-wrap { display:flex; height:40px; background:rgba(255,255,255,.04); border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.diff-btn { padding:0 13px; background:none; border:none; border-right:1px solid var(--border); color:var(--muted); font-size:12px; font-weight:500; cursor:pointer; font-family:inherit; transition:color .12s,background .12s; white-space:nowrap; }
.diff-btn:last-child { border-right:none; } .diff-btn:hover { color:#fff; } .diff-btn.on { background:var(--purple); color:#fff; }
.sp { flex:1; min-width:0; }
.status { font-size:13px; color:var(--muted); }
.status.win { color:var(--green); font-weight:600; } .status.lose { color:var(--red); font-weight:600; }
.btn { height:40px; padding:0 26px; border:none; border-radius:6px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap; transition:opacity .1s,transform .08s; }
.btn:active { transform:scale(0.96); } .btn:disabled { opacity:.3; cursor:not-allowed; transform:none; }
.btn-start { background:var(--yellow); color:#111; }
.btn-hop   { background:var(--purple); color:#fff; font-size:15px; }
.btn-co    { background:var(--green);  color:#fff; }
@media (max-width:700px) { .ctrl{gap:10px;padding:10px 14px;} .diff-btn{padding:0 8px;font-size:11px;} .kbd{display:none;} .status{display:none;} }
</style>
</head>
<body>
<header>
  <a class="back" href="/">← Home</a>
  <span class="title">Mission Uncrossable</span>
  <span class="kbd"><kbd>Space</kbd> hop &nbsp;·&nbsp; <kbd>C</kbd> cash out</span>
</header>
<div id="canvas-wrap"><canvas id="canvas"></canvas></div>
<div class="ctrl">
  <div class="cg">
    <div class="cl">Balance</div>
    <div class="bal-val" id="bal-disp">$1,000</div>
  </div>
  <div class="cg" id="g-bet">
    <div class="cl">Bet Amount</div>
    <div class="bet-wrap">
      <span class="bet-pre">$</span>
      <input id="bet-inp" type="number" min="1" max="999999" value="10">
      <div class="bet-adj">
        <button onclick="adjBet(0.5)">½</button>
        <button onclick="adjBet(2)">2×</button>
        <button onclick="maxBet()">Max</button>
      </div>
    </div>
  </div>
  <div class="cg" id="g-mult" style="display:none">
    <div class="cl">Multiplier</div>
    <div class="mult-big" id="mult-val">—</div>
    <div class="mult-sub" id="mult-sub">Hop to earn!</div>
  </div>
  <div class="cg" id="g-diff">
    <div class="cl">Difficulty</div>
    <div class="diff-wrap">
      <button class="diff-btn" data-d="easy"      onclick="setDiff('easy')">Easy</button>
      <button class="diff-btn" data-d="medium"    onclick="setDiff('medium')">Medium</button>
      <button class="diff-btn" data-d="hard"      onclick="setDiff('hard')">Hard</button>
      <button class="diff-btn on" data-d="daredevil" onclick="setDiff('daredevil')">Daredevil</button>
    </div>
  </div>
  <div class="sp"></div>
  <div class="status" id="status">Place a bet and hit Start</div>
  <button class="btn btn-start" id="btn-start"  onclick="startGame()">Start Game</button>
  <button class="btn btn-hop"   id="btn-hop"    onclick="hop()"      style="display:none">HOP →</button>
  <button class="btn btn-co"    id="btn-co"     onclick="cashOut()"  style="display:none" disabled>Cash Out</button>
</div>
<script>
'use strict';

// ── Config ────────────────────────────────────────────────────
const DIFF = {
  easy:      { spd:0.36, safeProb:0.50, multStep:1.12, n:1 },
  medium:    { spd:0.62, safeProb:0.35, multStep:1.40, n:1 },
  hard:      { spd:0.98, safeProb:0.20, multStep:1.70, n:2 },
  daredevil: { spd:1.70, safeProb:0.06, multStep:2.10, n:2 },
};
const LANE_DEFS = [
  {col:'#e03535',acc:'#a01818',type:'car'},
  {col:'#1d8cf8',acc:'#0e5cbf',type:'sedan'},
  {col:'#f5c842',acc:'#b89010',type:'bus'},
  {col:'#ff7c00',acc:'#c05000',type:'suv'},
  {col:'#22d3a0',acc:'#118060',type:'car'},
  {col:'#9b5de5',acc:'#5e2aaa',type:'van'},
  {col:'#f72585',acc:'#a00050',type:'sedan'},
  {col:'#06d6a0',acc:'#037a5a',type:'truck'},
];
const CAR_ASPECT = {car:2.1, sedan:2.3, bus:1.7, suv:2.0, van:1.8, truck:2.6};
const NV   = 9;   // lanes generated ahead in view
const SAFE = 88;  // left safe-zone width px
const BLOCK_TOP = 0.30; // safe-zone top barrier (fraction of CH)
const BLOCK_BOT = 0.70; // safe-zone bottom barrier

// ── Canvas ────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
let CW=0, CH=0;
function resize(){
  CW = canvas.parentElement.clientWidth;
  CH = canvas.parentElement.clientHeight;
  canvas.width=CW; canvas.height=CH;
}
function LW(){ return (CW-SAFE)/NV; }

// ── Helpers ───────────────────────────────────────────────────
function $id(i){ return document.getElementById(i); }
function easeOut(t){ return 1-(1-t)*(1-t); }
function lerp(a,b,t){ return a+(b-a)*t; }
function rrect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function carDims(type){
  const lw=LW(), m=lw*0.16, w=lw-m*2;
  return {w, h:w*(CAR_ASPECT[type]||2.0), m};
}

// ── Balance ───────────────────────────────────────────────────
let bal;
function loadBal(){ bal=parseInt(localStorage.getItem('rys-bal')||'1000',10); if(!bal||bal<1)bal=1000; }
function saveBal(){ localStorage.setItem('rys-bal',String(bal)); if(window.RYS)window.RYS.setBal(bal); }
function dispBal(){ $id('bal-disp').textContent='$'+bal.toLocaleString(); }

// ── Infinite lane store ───────────────────────────────────────
// laneStore[absIdx] = { safe, col, acc, type, dir, cars:[] }
let laneStore = [];
let storeMax  = -1;

function genOneLane(absIdx){
  const cfg = DIFF[diff];
  const def = LANE_DEFS[absIdx % LANE_DEFS.length];
  const dir = absIdx%2===0 ? -1 : 1;
  const safe = Math.random() < cfg.safeProb;
  const cars = [];
  for(let j=0;j<cfg.n;j++){
    const spd = cfg.spd * (0.78+Math.random()*0.44) * (1 + absIdx*0.018);
    // Safe lanes: park cars in top/bottom zones away from crossing point
    const startY = safe
      ? (j===0 ? Math.random()*CH*BLOCK_TOP*0.85
               : CH*BLOCK_BOT + Math.random()*CH*(1-BLOCK_BOT)*0.85)
      : (CH/cfg.n)*j + Math.random()*(CH/cfg.n)*0.65;
    cars.push({
      ai: absIdx,   // absolute index
      dir: safe ? (j===0?1:-1) : dir,  // safe cars bounce within their zone
      y: startY,
      spd,
      type: def.type, col: def.col, acc: def.acc,
      safe
    });
  }
  return {safe, col:def.col, acc:def.acc, type:def.type, dir, cars};
}

function ensureLanes(upTo){
  while(storeMax<upTo){
    storeMax++;
    laneStore[storeMax]=genOneLane(storeMax);
  }
}

function resetStore(){
  laneStore=[]; storeMax=-1;
  ensureLanes(NV+4);
}

// ── Camera ────────────────────────────────────────────────────
let camX=0; // pixels scrolled left (increases as chicken advances)

function updateCam(dt){
  if(absLane<=0){ camX=lerp(camX,0,1-Math.exp(-dt*10)); return; }
  // Keep chicken at ~65% of road width
  const roadW = CW-SAFE;
  let target = (absLane-1)*LW()+LW()*0.5 - roadW*0.65;
  if(target<0) target=0;
  camX = lerp(camX, target, 1-Math.exp(-dt*7));
}

// Screen x of lane absIdx left edge
function laneLeft(absIdx){ return SAFE+(absIdx-1)*LW()-camX; }
function laneCX(absIdx){ return laneLeft(absIdx)+LW()/2; }

// Screen x of chicken
function chickSX(){
  if(absLane===0) return SAFE/2;
  return laneCX(absLane);
}

// ── Game state ────────────────────────────────────────────────
let gs='idle', bet, diff='daredevil';
let absLane=0, hops=0;
let cyArc=0, landFlash=0;
let arcT=0, arcDur=0.18, arcActive=false;
let deathTimer=0, deathAlpha=0, shakeT=0, winFlash=0;
let lastTs=0;

function isHopping(){ return arcActive; }

function getMult(n){ return Math.pow(DIFF[diff].multStep, n); }

// ── Car movement ──────────────────────────────────────────────
function moveCars(dt){
  const topLimit  = CH*BLOCK_TOP;
  const botLimit  = CH*BLOCK_BOT;
  // Only move cars in or near visible range
  const firstVis = Math.max(0, Math.floor(camX/LW()));
  const lastVis  = firstVis + NV + 2;
  for(let ai=firstVis; ai<=Math.min(storeMax, lastVis); ai++){
    const ld = laneStore[ai];
    if(!ld) continue;
    for(const c of ld.cars){
      if(c.safe){
        // Bounce in top or bottom zone
        c.y += c.spd * c.dir * CH * dt;
        if(c.dir===1 && c.y > topLimit - carDims(c.type).h*0.2){
          c.dir=-1; c.y=topLimit-carDims(c.type).h*0.2;
        }
        if(c.dir===-1 && c.y+carDims(c.type).h < botLimit){
          if(c.y < 0){ c.y=0; c.dir=1; }
        }
        // Bottom zone cars
        if(c.y>=CH*BLOCK_BOT){
          c.y += c.spd*c.dir*CH*dt;
          if(c.dir===-1 && c.y < CH*BLOCK_BOT){ c.dir=1; c.y=CH*BLOCK_BOT; }
          if(c.dir===1  && c.y+carDims(c.type).h > CH+8){ c.y=CH*BLOCK_BOT; }
        }
      } else {
        c.y += c.spd * ld.dir * CH * dt;
        const {h} = carDims(c.type);
        if(ld.dir===1  && c.y > CH+h+8) c.y=-h-8;
        if(ld.dir===-1 && c.y < -h-8)   c.y=CH+h+8;
      }
    }
  }
}

function checkHit(){
  if(absLane<=0 || isHopping()) return false;
  const ld = laneStore[absLane];
  if(!ld||ld.safe) return false;
  const MY=CH/2, HB=CH*0.075;
  for(const c of ld.cars){
    const {h}=carDims(c.type);
    if(c.y<MY+HB && c.y+h>MY-HB) return true;
  }
  return false;
}

// ── Diff / start ──────────────────────────────────────────────
function setDiff(d){
  if(gs==='playing')return;
  diff=d;
  document.querySelectorAll('.diff-btn').forEach(b=>b.classList.toggle('on',b.dataset.d===d));
  resetStore();
}

function startGame(){
  const inp=parseInt($id('bet-inp').value,10)||10;
  bet=Math.max(1,Math.min(bal,inp));
  if(bal<1){setStatus('No balance!');return;}
  bal-=bet; saveBal(); dispBal();
  absLane=0; hops=0; camX=0;
  deathTimer=0; deathAlpha=0; shakeT=0; winFlash=0; landFlash=0;
  arcActive=false; cyArc=0;
  resetStore();
  gs='playing'; showPlay(); updMult(); setStatus('');
}

function hop(){
  if(gs!=='playing'||isHopping())return;
  absLane++;
  hops++;
  ensureLanes(absLane+NV+4);
  landFlash=0.35;
  arcT=0; arcActive=true;
  updMult();
}

function cashOut(){
  if(gs!=='playing'||absLane===0||isHopping())return;
  const m=getMult(hops);
  const win=Math.floor(bet*m);
  bal+=win; saveBal(); dispBal();
  gs='idle';
  absLane=0; camX=0;
  showIdle(); setStatus('Cashed out at '+m.toFixed(2)+'× · +$'+win.toLocaleString(),'win');
}

function doDead(){
  if(gs==='dead'||gs==='idle')return;
  gs='dead'; deathTimer=1.8; deathAlpha=1; shakeT=0.42;
  showIdle(); setStatus('Splat! Lost $'+bet.toLocaleString(),'lose');
}

// ── UI helpers ────────────────────────────────────────────────
function showIdle(){
  $id('g-bet').style.display=''; $id('g-mult').style.display='none';
  $id('g-diff').style.display=''; $id('btn-start').style.display='';
  $id('btn-hop').style.display='none'; $id('btn-co').style.display='none';
  $id('bet-inp').disabled=false;
  document.querySelectorAll('.bet-adj button,.diff-btn').forEach(b=>b.disabled=false);
  dispBal();
}
function showPlay(){
  $id('g-bet').style.display='none'; $id('g-mult').style.display='';
  $id('g-diff').style.display='none'; $id('btn-start').style.display='none';
  $id('btn-hop').style.display=''; $id('btn-co').style.display='';
  $id('btn-co').disabled=true;
}
function updMult(){
  if(absLane===0){
    $id('mult-val').textContent='—';
    $id('mult-sub').textContent='Hop to earn!';
    $id('btn-co').disabled=true;
    return;
  }
  const m=getMult(hops);
  $id('mult-val').textContent=m.toFixed(2)+'×';
  $id('mult-sub').textContent='Cash out: $'+Math.floor(bet*m).toLocaleString();
  $id('btn-co').disabled=false;
}
function setStatus(txt,cls){ const el=$id('status'); el.textContent=txt; el.className='status'+(cls?' '+cls:''); }
function adjBet(f){ const i=$id('bet-inp'); i.value=Math.max(1,Math.min(bal,Math.floor((parseFloat(i.value)||10)*f))); }
function maxBet(){ $id('bet-inp').value=bal; }

// ── Drawing ───────────────────────────────────────────────────
function drawCar(c){
  const sx = laneLeft(c.ai);
  if(sx+LW()<SAFE||sx>CW) return; // clip
  const {w,h,m}=carDims(c.type);
  const cx=sx+m, cy=c.y, r=Math.min(6,w*.10);

  ctx.shadowColor='rgba(0,0,0,0.50)'; ctx.shadowBlur=10; ctx.shadowOffsetY=4;
  ctx.fillStyle=c.col; rrect(cx,cy,w,h,r); ctx.fill();
  ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetY=0;

  const cPad=w*.14, cTop=h*.22, cH=h*.50;
  const ld=laneStore[c.ai];
  ctx.fillStyle=c.acc; rrect(cx+cPad,cy+cTop,w-cPad*2,cH,r*.6); ctx.fill();

  const wsW=(w-cPad*2)*.88, wsH=Math.max(4,cH*.18), wsX=cx+cPad+(w-cPad*2-wsW)/2;
  ctx.fillStyle='rgba(160,215,255,0.32)';
  const fwd = ld ? ld.dir : c.dir;
  if(fwd===1) rrect(wsX,cy+cTop+cH-wsH,wsW,wsH,2);
  else        rrect(wsX,cy+cTop,wsW,wsH,2);
  ctx.fill();

  const rwH=Math.max(3,cH*.12);
  ctx.fillStyle='rgba(120,180,255,0.20)';
  if(fwd===1) rrect(wsX,cy+cTop,wsW,rwH,2);
  else        rrect(wsX,cy+cTop+cH-rwH,wsW,rwH,2);
  ctx.fill();

  const hlW=w*.28, hlH=Math.max(3,h*.024);
  ctx.fillStyle='#fffde8';
  if(fwd===1){ ctx.fillRect(cx+4,cy+h-hlH,hlW,hlH); ctx.fillRect(cx+w-4-hlW,cy+h-hlH,hlW,hlH); }
  else       { ctx.fillRect(cx+4,cy,hlW,hlH); ctx.fillRect(cx+w-4-hlW,cy,hlW,hlH); }

  const tlW=w*.22, tlH=Math.max(3,h*.020);
  ctx.fillStyle='#ff2020';
  if(fwd===1){ ctx.fillRect(cx+4,cy,tlW,tlH); ctx.fillRect(cx+w-4-tlW,cy,tlW,tlH); }
  else       { ctx.fillRect(cx+4,cy+h-tlH,tlW,tlH); ctx.fillRect(cx+w-4-tlW,cy+h-tlH,tlW,tlH); }

  const wW=Math.max(3,w*.09), wH=Math.max(7,h*.11);
  ctx.fillStyle='#080b1c';
  ctx.fillRect(cx-wW+2,cy+h*.14,wW,wH); ctx.fillRect(cx+w-2,cy+h*.14,wW,wH);
  ctx.fillRect(cx-wW+2,cy+h*.70,wW,wH); ctx.fillRect(cx+w-2,cy+h*.70,wW,wH);
  ctx.fillStyle='rgba(255,255,255,0.07)';
  ctx.fillRect(cx-wW+2,cy+h*.14,wW,wH*.4); ctx.fillRect(cx+w-2,cy+h*.14,wW,wH*.4);
  ctx.fillRect(cx-wW+2,cy+h*.70,wW,wH*.4); ctx.fillRect(cx+w-2,cy+h*.70,wW,wH*.4);
}

function drawRoadblock(absIdx){
  const sx = laneLeft(absIdx);
  if(sx+LW()<SAFE||sx>CW) return;
  const lw = LW();
  const bW = lw*0.82, bH = Math.max(8,CH*0.022);
  const bX = sx+(lw-bW)/2;
  const stripes = 5;
  const sw = bW/stripes;

  [CH*BLOCK_TOP, CH*BLOCK_BOT].forEach(by=>{
    // Striped barricade
    for(let s=0;s<stripes;s++){
      ctx.fillStyle = s%2===0 ? '#f5c842' : '#fff';
      ctx.fillRect(bX+s*sw, by-bH/2, sw, bH);
    }
    ctx.strokeStyle='rgba(0,0,0,0.45)'; ctx.lineWidth=1;
    ctx.strokeRect(bX, by-bH/2, bW, bH);
    // Posts
    const pw=Math.max(3,lw*.04), ph=Math.max(18,CH*.06);
    ctx.fillStyle='#7a8494';
    ctx.fillRect(bX+lw*.06-pw/2, by-ph/2, pw, ph);
    ctx.fillRect(bX+bW-lw*.06-pw/2, by-ph/2, pw, ph);
  });

  // Flashing SAFE label
  const alpha = 0.55+0.35*Math.sin(Date.now()/400);
  ctx.globalAlpha=alpha;
  ctx.font=`bold ${Math.max(9,Math.min(13,lw*.11))}px Inter,sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#f5c842';
  ctx.fillText('SAFE', sx+lw/2, CH/2);
  ctx.globalAlpha=1;
}

function drawRoad(){
  const lw=LW();
  const firstVis = Math.max(0, Math.floor(camX/lw)-1);
  const lastVis  = firstVis+NV+2;

  for(let ai=firstVis;ai<=lastVis;ai++){
    const sx=laneLeft(ai);
    if(sx>CW||sx+lw<SAFE) continue;
    ctx.fillStyle=ai%2===0?'#131640':'#101338';
    ctx.fillRect(sx,0,lw,CH);
  }

  // Active lane glow
  if(gs==='playing'&&absLane>0){
    const sx=laneLeft(absLane);
    if(sx>SAFE-lw&&sx<CW){
      const g=ctx.createLinearGradient(sx,0,sx+lw,0);
      g.addColorStop(0,'rgba(30,203,79,0)');
      g.addColorStop(.5,'rgba(30,203,79,0.09)');
      g.addColorStop(1,'rgba(30,203,79,0)');
      ctx.fillStyle=g; ctx.fillRect(sx,0,lw,CH);
    }
  }

  // Dashed dividers
  ctx.setLineDash([CH*.04,CH*.03]); ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=1;
  for(let ai=firstVis;ai<=lastVis+1;ai++){
    const x=laneLeft(ai);
    if(x<SAFE-lw||x>CW) continue;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,CH); ctx.stroke();
  }
  ctx.setLineDash([]);

  // Direction arrows
  const afs=Math.max(9,CH*.042);
  ctx.font='bold '+afs+'px Inter,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(255,255,255,0.05)';
  for(let ai=firstVis;ai<=lastVis;ai++){
    const ld=laneStore[ai]; if(!ld) continue;
    const sx=laneLeft(ai); if(sx+lw<SAFE||sx>CW) continue;
    const ar=ld.dir===1?'▼':'▲';
    ctx.fillText(ar,sx+lw/2,CH*.09); ctx.fillText(ar,sx+lw/2,CH*.91);
  }
}

function drawGrass(){
  ctx.fillStyle='#1a5c30'; ctx.fillRect(0,0,SAFE,CH);
  ctx.fillStyle='rgba(255,255,255,0.03)';
  for(let y=0;y<CH;y+=CH*.1) ctx.fillRect(0,y,SAFE-10,CH*.05);
  ctx.fillStyle='#4a5568'; ctx.fillRect(SAFE-10,0,10,CH);
  ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.fillRect(SAFE-10,0,1.5,CH);
  [[SAFE*.40,CH*.28,14,'#2d6a4f'],[SAFE*.32,CH*.34,10,'#245a40'],[SAFE*.50,CH*.33,11,'#267a4a']].forEach(([x,y,r,c])=>{
    ctx.fillStyle=c; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  });
  const hx=SAFE*.44,hy=CH*.68;
  ctx.fillStyle='#e63946'; rrect(hx-5,hy-14,10,14,2); ctx.fill();
  ctx.fillStyle='#c01020'; rrect(hx-7,hy-17,14,5,1); ctx.fill(); ctx.fillRect(hx-3,hy,6,5);
}

function drawMultipliers(){
  const lw=LW();
  const firstVis=Math.max(1,Math.floor(camX/lw));
  const lastVis=firstVis+NV+1;
  const fs=Math.max(9,Math.min(14,lw*.115));
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  for(let ai=firstVis;ai<=lastVis;ai++){
    const sx=laneLeft(ai); if(sx+lw<SAFE||sx>CW) continue;
    const ld=laneStore[ai];
    if(ld&&ld.safe) continue; // skip safe lanes (no mult shown)
    const passed=gs==='playing'&&absLane>ai;
    const active=gs==='playing'&&absLane===ai;
    const futureDiff = ai - absLane; // 0=current, positive=ahead
    if(futureDiff<0 && !passed) continue;
    ctx.font=(active?'700 ':'500 ')+fs+'px Inter,sans-serif';
    if(passed){
      ctx.fillStyle='rgba(30,203,79,0.5)';
      ctx.fillText('✓',sx+lw/2,CH-CH*.022);
    } else {
      const m=getMult(hops+Math.max(0,futureDiff));
      ctx.fillStyle=active?'#fff':'rgba(90,104,150,0.8)';
      ctx.fillText(m.toFixed(2)+'×',sx+lw/2,CH-CH*.022);
    }
  }
}

function drawChicken(){
  const sx=chickSX();
  const sy=CH/2+cyArc;
  const sz=Math.round(Math.min(LW(),CH)*.28);
  ctx.save();
  if(gs==='dead') ctx.globalAlpha=Math.max(0,deathAlpha);
  if(landFlash>0){
    ctx.globalAlpha=(gs==='dead'?Math.max(0,deathAlpha):1)*Math.min(1,landFlash);
    ctx.beginPath(); ctx.arc(sx,CH/2,sz*.65,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.12)'; ctx.fill();
    ctx.globalAlpha=gs==='dead'?Math.max(0,deathAlpha):1;
  }
  const sc=1+landFlash*.12;
  ctx.translate(sx,sy); ctx.scale(sc,sc);
  ctx.font=sz+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(gs==='dead'&&deathAlpha>0.5?'💥':'🐔',0,0);
  ctx.restore();
}

function drawScene(){
  ctx.fillStyle='#0a0c20'; ctx.fillRect(0,0,CW,CH);
  drawRoad();

  // Roadblocks (safe lanes)
  const firstVis=Math.max(0,Math.floor(camX/LW())-1);
  for(let ai=firstVis;ai<=firstVis+NV+2&&ai<=storeMax;ai++){
    if(laneStore[ai]&&laneStore[ai].safe) drawRoadblock(ai);
  }

  // Cars
  for(let ai=firstVis;ai<=firstVis+NV+2&&ai<=storeMax;ai++){
    const ld=laneStore[ai]; if(!ld) continue;
    for(const c of ld.cars) drawCar(c);
  }

  drawGrass();
  drawMultipliers();
  drawChicken();

  if(winFlash>0){ ctx.fillStyle='rgba(30,203,79,'+(winFlash*.18)+')'; ctx.fillRect(0,0,CW,CH); }
  if(shakeT>0){   ctx.fillStyle='rgba(239,68,68,'+(shakeT*.28)+')';  ctx.fillRect(0,0,CW,CH); }
}

// ── Main loop ─────────────────────────────────────────────────
function tick(ts){
  const dt=Math.min((ts-lastTs)/1000,0.05); lastTs=ts;

  // Arc animation
  if(arcActive){
    arcT=Math.min(arcDur,arcT+dt);
    cyArc=-Math.sin((arcT/arcDur)*Math.PI)*CH*0.09;
    if(arcT>=arcDur){ arcActive=false; cyArc=0; }
  }

  moveCars(dt);
  updateCam(dt);
  if(landFlash>0) landFlash=Math.max(0,landFlash-dt*4);

  // Collision while sitting in a lane (not during hop)
  if(gs==='playing'&&!arcActive&&absLane>0){
    if(checkHit()) doDead();
  }

  if(gs==='dead'){
    deathTimer=Math.max(0,deathTimer-dt);
    deathAlpha=deathTimer/1.8; shakeT=Math.max(0,shakeT-dt);
    if(deathTimer<=0){ gs='idle'; deathAlpha=0; absLane=0; camX=0; }
  }
  if(winFlash>0) winFlash=Math.max(0,winFlash-dt*1.5);

  ctx.save();
  if(shakeT>0){ const m=shakeT*6; ctx.translate((Math.random()-.5)*m,(Math.random()-.5)*m); }
  drawScene();
  ctx.restore();
  requestAnimationFrame(tick);
}

canvas.addEventListener('click',()=>{ if(gs==='playing')hop(); });
canvas.addEventListener('touchstart',e=>{ e.preventDefault(); if(gs==='playing')hop(); },{passive:false});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowRight'){
    if(gs==='playing'){e.preventDefault();hop();}
    else if(gs==='idle'&&e.code==='Space'){e.preventDefault();startGame();}
  }
  if(e.code==='KeyC'&&gs==='playing') cashOut();
});
window.addEventListener('resize',()=>{ resize(); resetStore(); });

resize(); loadBal(); resetStore();
gs='idle'; deathAlpha=0; deathTimer=0; shakeT=0; camX=0; absLane=0;
dispBal(); showIdle();
requestAnimationFrame(ts=>{ lastTs=ts; requestAnimationFrame(tick); });
</script>
<script src="/admin/control.js"></script>
</body>
</html>
